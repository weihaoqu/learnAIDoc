<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" stroke-width="1" opacity="0.38"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
  <style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;letter-spacing:0}.mono{font-family:"SFMono-Regular","SF Mono",Consolas,monospace;letter-spacing:0}</style>
  <rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.92"/><rect x="84" y="68" width="282" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="17" font-weight="900" text-anchor="start">SWIRL STEP LEARNING</text><rect x="1231" y="68" width="285" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1373.5" y="97" fill="#5E6670" font-size="15" font-weight="780" text-anchor="middle">PART 5  50:29-63:21</text><text class="ui" x="86" y="188" fill="#171717" font-size="52" font-weight="920" text-anchor="start">SWiRL Learns</text><text class="ui" x="86" y="247" fill="#171717" font-size="52" font-weight="920" text-anchor="start">at the Step Level</text><text class="ui" x="90" y="326" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">Offline tool trajectories supply intermediate feedback without a live call in every</text><text class="ui" x="90" y="355" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">rollout.</text><rect x="70" y="400" width="660" height="350" rx="8" fill="#F3F7FF" stroke="#2563EB" stroke-width="2"/><text class="mono" x="110" y="448" fill="#2563EB" font-size="19" font-weight="900" text-anchor="start">STAGE 1  OFFLINE COLLECTION</text><g><rect x="120" y="510" width="190" height="54" rx="8" fill="#FFFCF4" stroke="#2563EB" stroke-width="2"/><text class="mono" x="215" y="545" fill="#2563EB" font-size="18" font-weight="850" text-anchor="middle">tool trajectory</text></g><path d="M310 537 L395 537" fill="none" stroke="#2563EB" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="395" y="510" width="190" height="54" rx="8" fill="#FFFCF4" stroke="#2563EB" stroke-width="2"/><text class="mono" x="490" y="545" fill="#2563EB" font-size="18" font-weight="850" text-anchor="middle">process labels</text></g><path d="M490 564 L490 635" fill="none" stroke="#2563EB" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="330" y="635" width="320" height="54" rx="8" fill="#FFF9E8" stroke="#8B7355" stroke-width="2"/><text class="mono" x="490" y="670" fill="#8B7355" font-size="18" font-weight="850" text-anchor="middle">STORED OBSERVATIONS</text></g><rect x="850" y="400" width="670" height="350" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="890" y="448" fill="#2F7373" font-size="19" font-weight="900" text-anchor="start">STAGE 2  STEP-WISE RL</text><g><rect x="900" y="510" width="180" height="54" rx="8" fill="#FFFCF4" stroke="#2F7373" stroke-width="2"/><text class="mono" x="990" y="545" fill="#2F7373" font-size="18" font-weight="850" text-anchor="middle">state + context</text></g><path d="M1080 537 L1170 537" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="1170" y="510" width="180" height="54" rx="8" fill="#FFFCF4" stroke="#2F7373" stroke-width="2"/><text class="mono" x="1260" y="545" fill="#2F7373" font-size="18" font-weight="850" text-anchor="middle">propose action</text></g><path d="M1260 564 L1260 635" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="1080" y="635" width="360" height="54" rx="8" fill="#FFFCF4" stroke="#16803C" stroke-width="2"/><text class="mono" x="1260" y="670" fill="#16803C" font-size="18" font-weight="850" text-anchor="middle">judge step -&gt; update policy</text></g><path d="M730 675 L850 675" fill="none" stroke="#8B7355" stroke-width="5"  marker-end="url(#arrow)"/><rect x="390" y="780" width="820" height="94" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="410" y="807" fill="#B42318" font-size="14" font-weight="900" text-anchor="start">CAVEAT</text><text class="ui" x="410" y="835" fill="#171717" font-size="19" font-weight="640" text-anchor="start">Stored feedback avoids live-tool instability but can become</text><text class="ui" x="410" y="861" fill="#171717" font-size="19" font-weight="640" text-anchor="start">stale or off-policy.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" stroke-width="1" opacity="0.38"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
  <style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;letter-spacing:0}.mono{font-family:"SFMono-Regular","SF Mono",Consolas,monospace;letter-spacing:0}</style>
  <rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.92"/><rect x="84" y="68" width="270" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="17" font-weight="900" text-anchor="start">FEEDBACK SEMANTICS</text><rect x="1136.1" y="68" width="379.90000000000003" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1326.05" y="97" fill="#5E6670" font-size="15" font-weight="780" text-anchor="middle">PART 5  54:34-63:21 / 66:16-73:47</text><text class="ui" x="86" y="188" fill="#171717" font-size="52" font-weight="920" text-anchor="start">Process and Outcome Signals</text><text class="ui" x="86" y="247" fill="#171717" font-size="52" font-weight="920" text-anchor="start">Fail Differently</text><text class="ui" x="90" y="326" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">A correct answer can hide bad steps; a plausible step can still fail in the live</text><text class="ui" x="90" y="355" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">environment.</text><text class="mono" x="210" y="560" fill="#2563EB" font-size="20" font-weight="900" text-anchor="middle">PROCESS</text><text class="mono" x="210" y="594" fill="#2563EB" font-size="20" font-weight="900" text-anchor="middle">QUALITY</text><text class="mono" x="820" y="410" fill="#2F7373" font-size="20" font-weight="900" text-anchor="middle">OUTCOME QUALITY</text><rect x="390" y="465" width="400" height="145" rx="8" fill="#F2FBF8" stroke="#16803C" stroke-width="2"/><text class="mono" x="420" y="513" fill="#16803C" font-size="18" font-weight="900" text-anchor="start">SOUND + CORRECT</text><text class="ui" x="420" y="560" fill="#171717" font-size="22" font-weight="760" text-anchor="start">strong evidence</text><rect x="850" y="465" width="400" height="145" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="880" y="513" fill="#B42318" font-size="18" font-weight="900" text-anchor="start">BAD STEP + CORRECT</text><text class="ui" x="880" y="560" fill="#171717" font-size="22" font-weight="760" text-anchor="start">lucky outcome</text><rect x="390" y="640" width="400" height="145" rx="8" fill="#FFF9E8" stroke="#8B7355" stroke-width="2"/><text class="mono" x="420" y="688" fill="#8B7355" font-size="18" font-weight="900" text-anchor="start">SOUND + WRONG</text><text class="ui" x="420" y="735" fill="#171717" font-size="22" font-weight="760" text-anchor="start">later failure</text><rect x="850" y="640" width="400" height="145" rx="8" fill="#FFF5F3" stroke="#722F37" stroke-width="2"/><text class="mono" x="880" y="688" fill="#722F37" font-size="18" font-weight="900" text-anchor="start">PLAUSIBLE + FAILS LIVE</text><text class="ui" x="880" y="735" fill="#171717" font-size="22" font-weight="760" text-anchor="start">process false positive</text><path d="M300 720 L300 465" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><path d="M390 430 L1250 430" fill="none" stroke="#2F7373" stroke-width="3"  marker-end="url(#arrow)"/><rect x="415" y="790" width="810" height="94" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="435" y="817" fill="#B42318" font-size="14" font-weight="900" text-anchor="start">CAVEAT</text><text class="ui" x="435" y="845" fill="#171717" font-size="19" font-weight="640" text-anchor="start">The verifier defines what the policy learns; neither axis</text><text class="ui" x="435" y="871" fill="#171717" font-size="19" font-weight="640" text-anchor="start">certifies live execution by itself.</text></svg>
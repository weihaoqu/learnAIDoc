  <rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.92"/><rect x="84" y="68" width="258" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="17" font-weight="900" text-anchor="start">METHOD DIAGNOSTIC</text><rect x="1156.7" y="68" width="359.3" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1336.35" y="97" fill="#5E6670" font-size="15" font-weight="780" text-anchor="middle">PART 5  whole-lecture synthesis</text><text class="ui" x="86" y="188" fill="#171717" font-size="52" font-weight="920" text-anchor="start">Choose the Bottleneck</text><text class="ui" x="86" y="247" fill="#171717" font-size="52" font-weight="920" text-anchor="start">Before You Choose the Method</text><text class="ui" x="90" y="326" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">Search, parallelize, learn, or stop: evaluator quality and reversibility gate every</text><text class="ui" x="90" y="355" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">route.</text><rect x="90" y="440" width="310" height="250" rx="8" fill="#F3F7FF" stroke="#2563EB" stroke-width="2"/><text class="mono" x="245" y="492" fill="#2563EB" font-size="17" font-weight="900" text-anchor="middle">01</text><text class="ui" x="245" y="545" fill="#171717" font-size="20" font-weight="850" text-anchor="middle">UNCERTAIN PATH</text><g><rect x="145" y="610" width="200" height="54" rx="8" fill="#FFFCF4" stroke="#2563EB" stroke-width="2"/><text class="mono" x="245" y="645" fill="#2563EB" font-size="18" font-weight="850" text-anchor="middle">SEARCH</text></g><rect x="460" y="440" width="310" height="250" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="615" y="492" fill="#2F7373" font-size="17" font-weight="900" text-anchor="middle">02</text><text class="ui" x="615" y="545" fill="#171717" font-size="20" font-weight="850" text-anchor="middle">INDEPENDENT WORK</text><g><rect x="515" y="610" width="200" height="54" rx="8" fill="#FFFCF4" stroke="#2F7373" stroke-width="2"/><text class="mono" x="615" y="645" fill="#2F7373" font-size="18" font-weight="850" text-anchor="middle">PARALLELIZE</text></g><rect x="830" y="440" width="310" height="250" rx="8" fill="#FFF9E8" stroke="#8B7355" stroke-width="2"/><text class="mono" x="985" y="492" fill="#8B7355" font-size="17" font-weight="900" text-anchor="middle">03</text><text class="ui" x="985" y="545" fill="#171717" font-size="20" font-weight="850" text-anchor="middle">WEAK STEP POLICY</text><g><rect x="885" y="610" width="200" height="54" rx="8" fill="#FFFCF4" stroke="#8B7355" stroke-width="2"/><text class="mono" x="985" y="645" fill="#8B7355" font-size="18" font-weight="850" text-anchor="middle">LEARN</text></g><rect x="1200" y="440" width="310" height="250" rx="8" fill="#FFF5F3" stroke="#722F37" stroke-width="2"/><text class="mono" x="1355" y="492" fill="#722F37" font-size="17" font-weight="900" text-anchor="middle">04</text><text class="ui" x="1355" y="545" fill="#171717" font-size="20" font-weight="850" text-anchor="middle">UNSAFE / UNVERIFIABLE</text><g><rect x="1255" y="610" width="200" height="54" rx="8" fill="#FFFCF4" stroke="#722F37" stroke-width="2"/><text class="mono" x="1355" y="645" fill="#722F37" font-size="18" font-weight="850" text-anchor="middle">STOP</text></g><path d="M400 565 L450 565" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/><path d="M770 565 L820 565" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/><path d="M1140 565 L1190 565" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/><rect x="350" y="750" width="900" height="80" rx="8" fill="#FFFCF4" stroke="#B42318" stroke-width="2"/><text class="mono" x="800" y="785" fill="#B42318" font-size="20" font-weight="920" text-anchor="middle">GATE EVERY ROUTE: EVALUATOR QUALITY + REVERSIBILITY</text><text class="ui" x="800" y="817" fill="#5E6670" font-size="17" font-weight="700" text-anchor="middle">No added autonomy is a valid engineering choice.</text></svg>
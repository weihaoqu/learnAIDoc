3" stroke-width="3"  marker-end="url(#arrow)"/><circle cx="1245" cy="655" r="25" fill="#16803C" stroke="#2F7373" stroke-width="3"/><text class="mono" x="1245" y="661" fill="#FFFFFF" font-size="13" font-weight="900" text-anchor="middle">0.9</text><text class="ui" x="1375" y="695" fill="#5E6670" font-size="19" font-weight="700" text-anchor="middle">score and prune each step</text><rect x="390" y="785" width="820" height="96" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="410" y="813" fill="#B42318" font-size="15" font-weight="900" text-anchor="start">CAVEAT</text><text class="ui" x="410" y="842" fill="#171717" font-size="20" font-weight="640" text-anchor="start">Learned reward models can be confidently wrong or fail outside</text><text class="ui" x="410" y="869" fill="#171717" font-size="20" font-weight="640" text-anchor="start">their training distribution.</text></svg>
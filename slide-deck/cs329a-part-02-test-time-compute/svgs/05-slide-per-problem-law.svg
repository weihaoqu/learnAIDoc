<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" stroke-width="1" opacity="0.38"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
  <style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;letter-spacing:0}.mono{font-family:"SFMono-Regular","SF Mono",Consolas,monospace;letter-spacing:0}</style>
  <rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.9"/><rect x="84" y="68" width="282" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="17" font-weight="900" text-anchor="start">PER-PROBLEM SCALING</text><rect x="1077" y="68" width="439" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1296.5" y="97" fill="#5E6670" font-size="16" font-weight="780" text-anchor="middle">PART 2  05:27-07:33 + arXiv:2502.17578</text><text class="ui" x="86" y="188" fill="#171717" font-size="52" font-weight="920" text-anchor="start">One Problem Has an</text><text class="ui" x="86" y="247" fill="#171717" font-size="52" font-weight="920" text-anchor="start">Exponential Failure Curve</text><text class="ui" x="90" y="326" fill="#5E6670" font-size="24" font-weight="560" text-anchor="start">The familiar pass@k formula is an idealized model with visible assumptions.</text><rect x="90" y="420" width="620" height="290" rx="8" fill="#F3F7FF" stroke="#2563EB" stroke-width="2"/><text class="mono" x="400" y="505" fill="#2563EB" font-size="28" font-weight="900" text-anchor="middle">pass@k</text><text class="mono" x="400" y="585" fill="#171717" font-size="46" font-weight="900" text-anchor="middle">1 - (1 - p)^k</text><text class="mono" x="400" y="650" fill="#5E6670" font-size="21" font-weight="700" text-anchor="middle">failure after k = (1 - p)^k</text><rect x="780" y="400" width="735" height="330" rx="8" fill="#FFFCF4" stroke="#2F7373" stroke-width="2"/><text class="mono" x="825" y="445" fill="#2F7373" font-size="19" font-weight="900" text-anchor="start">FAILURE MASS SHRINKS WITH k</text><g><text class="mono" x="850" y="445" fill="#5E6670" font-size="17" font-weight="760" text-anchor="start">k=1</text><rect x="930" y="427" width="0" height="0"/><rect x="930" y="428" width="430" height="25" rx="5" fill="#D8D0C0"/><rect x="930" y="428" width="322.5" height="25" rx="5" fill="#2563EB"/></g><g><text class="mono" x="850" y="497" fill="#5E6670" font-size="17" font-weight="760" text-anchor="start">k=2</text><rect x="930" y="427" width="0" height="0"/><rect x="930" y="480" width="430" height="25" rx="5" fill="#D8D0C0"/><rect x="930" y="480" width="240.8" height="25" rx="5" fill="#2563EB"/></g><g><text class="mono" x="850" y="549" fill="#5E6670" font-size="17" font-weight="760" text-anchor="start">k=3</text><rect x="930" y="427" width="0" height="0"/><rect x="930" y="532" width="430" height="25" rx="5" fill="#D8D0C0"/><rect x="930" y="532" width="180.6" height="25" rx="5" fill="#2563EB"/></g><g><text class="mono" x="850" y="601" fill="#5E6670" font-size="17" font-weight="760" text-anchor="start">k=4</text><rect x="930" y="427" width="0" height="0"/><rect x="930" y="584" width="430" height="25" rx="5" fill="#D8D0C0"/><rect x="930" y="584" width="137.6" height="25" rx="5" fill="#2563EB"/></g><g><text class="mono" x="850" y="653" fill="#5E6670" font-size="17" font-weight="760" text-anchor="start">k=5</text><rect x="930" y="427" width="0" height="0"/><rect x="930" y="636" width="430" height="25" rx="5" fill="#D8D0C0"/><rect x="930" y="636" width="103.2" height="25" rx="5" fill="#2563EB"/></g><g><text class="mono" x="850" y="705" fill="#5E6670" font-size="17" font-weight="760" text-anchor="start">k=6</text><rect x="930" y="427" width="0" height="0"/><rect x="930" y="688" width="430" height="25" rx="5" fill="#D8D0C0"/><rect x="930" y="688" width="77.39999999999999" height="25" rx="5" fill="#2563EB"/></g><g><rect x="825" y="660" width="230" height="58" rx="8" fill="#FFF5F3" stroke="#722F37" stroke-width="2"/><text class="mono" x="940" y="697" fill="#722F37" font-size="20" font-weight="850" text-anchor="middle">constant p</text></g><g><rect x="1075" y="660" width="270" height="58" rx="8" fill="#FFF5F3" stroke="#722F37" stroke-width="2"/><text class="mono" x="1210" y="697" fill="#722F37" font-size="20" font-weight="850" text-anchor="middle">independent attempts</text></g><rect x="350" y="770" width="900" height="96" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="370" y="798" fill="#B42318" font-size="15" font-weight="900" text-anchor="start">CAVEAT</text><text class="ui" x="370" y="827" fill="#171717" font-size="20" font-weight="640" text-anchor="start">Samples from one model can be correlated, so effective diversity may</text><text class="ui" x="370" y="854" fill="#171717" font-size="20" font-weight="640" text-anchor="start">be much lower than k.</text></svg>
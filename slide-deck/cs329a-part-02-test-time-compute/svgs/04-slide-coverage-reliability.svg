text class="mono" x="355" y="793" fill="#B42318" font-size="15" font-weight="900" text-anchor="start">CAVEAT</text><text class="ui" x="355" y="822" fill="#171717" font-size="20" font-weight="640" text-anchor="start">A benchmark-to-product claim must name both the candidate metric and</text><text class="ui" x="355" y="849" fill="#171717" font-size="20" font-weight="640" text-anchor="start">the selection mechanism.</text></svg>
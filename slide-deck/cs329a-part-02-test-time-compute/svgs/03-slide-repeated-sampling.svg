  <style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;letter-spacing:0}.mono{font-family:"SFMono-Regular","SF Mono",Consolas,monospace;letter-spacing:0}</style>
  <rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.9"/><rect x="84" y="68" width="294" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="17" font-weight="900" text-anchor="start">CANDIDATE PRODUCTION</text><rect x="1077" y="68" width="439" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1296.5" y="97" fill="#5E6670" font-size="16" font-weight="780" text-anchor="middle">PART 2  01:29-03:36 + arXiv:2407.21787</text><text class="ui" x="86" y="188" fill="#171717" font-size="52" font-weight="920" text-anchor="start">Repeated Sampling</text><text class="ui" x="86" y="247" fill="#171717" font-size="52" font-weight="920" text-anchor="start">Buys More Chances</text><text class="ui" x="90" y="326" fill="#5E6670" font-size="24" font-weight="560" text-anchor="start">One fixed model produces many candidates; a verifier determines whether the gain is</text><text class="ui" x="90" y="356" fill="#5E6670" font-size="24" font-weight="560" text-anchor="start">usable.</text><rect x="90" y="455" width="295" height="170" rx="8" fill="#F3F7FF" stroke="#2563EB" stroke-width="2"/><text class="mono" x="237" y="510" fill="#2563EB" font-size="24" font-weight="900" text-anchor="middle">FIXED MODEL</text><text class="ui" x="237" y="557" fill="#171717" font-size="22" font-weight="700" text-anchor="middle">sample k times</text><path d="M385 540 L610 410" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><rect x="610" y="385" width="210" height="50" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="715" y="417" fill="#171717" font-size="17" font-weight="750" text-anchor="middle">candidate 1</text><path d="M385 540 L610 475" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><rect x="610" y="450" width="210" height="50" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="715" y="482" fill="#171717" font-size="17" font-weight="750" text-anchor="middle">candidate 2</text><path d="M385 540 L610 540" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><rect x="610" y="515" width="210" height="50" rx="8" fill="#F2FBF8" stroke="#16803C" stroke-width="2"/><text class="mono" x="715" y="547" fill="#16803C" font-size="17" font-weight="750" text-anchor="middle">candidate 3</text><path d="M385 540 L610 605" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><rect x="610" y="580" width="210" height="50" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="715" y="612" fill="#171717" font-size="17" font-weight="750" text-anchor="middle">candidate 4</text><path d="M385 540 L610 670" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><rect x="610" y="645" width="210" height="50" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="715" y="677" fill="#171717" font-size="17" font-weight="750" text-anchor="middle">candidate 5</text><path d="M820 540 L1010 540" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/><rect x="1010" y="420" width="215" height="120" rx="8" fill="#F2FBF8" stroke="#16803C" stroke-width="2"/><text class="mono" x="1117" y="466" fill="#16803C" font-size="20" font-weight="900" text-anchor="middle">ORACLE</text><text class="ui" x="1117" y="505" fill="#171717" font-size="17" font-weight="670" text-anchor="middle">measure coverage</text><rect x="1010" y="585" width="215" height="120" rx="8" fill="#FFF5F3" stroke="#722F37" stroke-width="2"/><text class="mono" x="1117" y="631" fill="#722F37" font-size="20" font-weight="900" text-anchor="middle">SELECTOR</text><text class="ui" x="1117" y="670" fill="#171717" font-size="17" font-weight="670" text-anchor="middle">choose to return</text><path d="M1225 480 L1430 480" fill="none" stroke="#16803C" stroke-width="4"  marker-end="url(#arrow)"/><path d="M1225 645 L1430 645" fill="none" stroke="#722F37" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="1430" y="451" width="90" height="58" rx="8" fill="#FFFCF4" stroke="#16803C" stroke-width="2"/><text class="mono" x="1475" y="488" fill="#16803C" font-size="20" font-weight="850" text-anchor="middle">any?</text></g><g><rect x="1430" y="616" width="90" height="58" rx="8" fill="#FFFCF4" stroke="#722F37" stroke-width="2"/><text class="mono" x="1475" y="653" fill="#722F37" font-size="20" font-weight="850" text-anchor="middle">one</text></g><rect x="360" y="760" width="880" height="96" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="380" y="788" fill="#B42318" font-size="15" font-weight="900" text-anchor="start">CAVEAT</text><text class="ui" x="380" y="817" fill="#171717" font-size="20" font-weight="640" text-anchor="start">Oracle coverage can rise even when a deployable selector cannot</text><text class="ui" x="380" y="844" fill="#171717" font-size="20" font-weight="640" text-anchor="start">find the correct candidate.</text></svg>
ext><rect x="830" y="395" width="310" height="210" rx="8" fill="#FFFCF4" stroke="#2F7373" stroke-width="2"/><text class="mono" x="985" y="448" fill="#2F7373" font-size="18" font-weight="900" text-anchor="middle">03</text><text class="ui" x="985" y="512" fill="#171717" font-size="25" font-weight="830" text-anchor="middle">What verifies success?</text><rect x="1190" y="395" width="310" height="210" rx="8" fill="#FFFCF4" stroke="#722F37" stroke-width="2"/><text class="mono" x="1345" y="448" fill="#722F37" font-size="18" font-weight="900" text-anchor="middle">04</text><text class="ui" x="1345" y="512" fill="#171717" font-size="25" font-weight="830" text-anchor="middle">When does it stop?</text><path d="M420 500 L465 500" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/><path d="M780 500 L825 500" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/><path d="M1140 500 L1185 500" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/><rect x="460" y="700" width="680" height="78" rx="8" fill="#F3F7FF" stroke="#2563EB" stroke-width="2"/><text class="mono" x="800" y="748" fill="#2563EB" font-size="22" font-weight="900" text-anchor="middle">NEXT: PART 3 - ROBUST VERIFICATION</text><text class="ui" x="800" y="825" fill="#5E6670" font-size="20" font-weight="740" text-anchor="middle">The bottleneck moves when generation, selection, cost, or latency saturates.</text></svg>
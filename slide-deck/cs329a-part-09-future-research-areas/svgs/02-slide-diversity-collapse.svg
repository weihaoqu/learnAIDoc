="3"  marker-end="url(#arrow)"/><rect x="100" y="485" width="180" height="56" rx="8" fill="#F3F7FF" stroke="#2563EB" stroke-width="2"/><text class="mono" x="190" y="520" fill="#2563EB" font-size="17" font-weight="850" text-anchor="middle">path 2</text><path d="M280 513 L620 533" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><rect x="100" y="550" width="180" height="56" rx="8" fill="#F3F7FF" stroke="#2563EB" stroke-width="2"/><text class="mono" x="190" y="585" fill="#2563EB" font-size="17" font-weight="850" text-anchor="middle">path 3</text><path d="M280 578 L620 541" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><rect x="100" y="615" width="180" height="56" rx="8" fill="#F3F7FF" stroke="#2563EB" stroke-width="2"/><text class="mono" x="190" y="650" fill="#2563EB" font-size="17" font-weight="850" text-anchor="middle">path 4</text><path d="M280 643 L620 549" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><rect x="100" y="680" width="180" height="56" rx="8" fill="#F3F7FF" stroke="#2563EB" stroke-width="2"/><text class="mono" x="190" y="715" fill="#2563EB" font-size="17" font-weight="850" text-anchor="middle">path 5</text><path d="M280 708 L620 557" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><rect x="620" y="460" width="250" height="190" rx="8" fill="#FFF9E8" stroke="#8B7355" stroke-width="2"/><text class="mono" x="745" y="515" fill="#8B7355" font-size="19" font-weight="900" text-anchor="middle">SELF-TRAIN</text><text class="ui" x="745" y="560" fill="#171717" font-size="18" font-weight="720" text-anchor="middle">same source</text><text class="ui" x="745" y="600" fill="#171717" font-size="18" font-weight="720" text-anchor="middle">many rounds</text><path d="M870 555 L1100 450" fill="none" stroke="#722F37" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1100" y="422" width="300" height="56" rx="8" fill="#FFF5F3" stroke="#722F37" stroke-width="2"/><text class="
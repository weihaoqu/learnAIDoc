<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" opacity=".38"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs><style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;letter-spacing:0}.mono{font-family:"SFMono-Regular","SF Mono",Consolas,monospace;letter-spacing:0}</style><rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity=".92"/><rect x="84" y="68" width="258" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="17" font-weight="900" text-anchor="start">EFFICIENCY METRIC</text><rect x="1166" y="68" width="350" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1341" y="97" fill="#5E6670" font-size="15" font-weight="760" text-anchor="middle">PART 9  39:59-51:53 + IPW v5</text><text class="ui" x="86" y="188" fill="#171717" font-size="50" font-weight="920" text-anchor="start">Intelligence</text><text class="ui" x="86" y="245" fill="#171717" font-size="50" font-weight="920" text-anchor="start">per Watt</text><text class="ui" x="90" y="320" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">Average task accuracy divided by average power, under a bounded workload and system</text><text class="ui" x="90" y="349" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">boundary.</text><rect x="90" y="430" width="470" height="270" rx="8" fill="#F3F7FF" stroke="#2563EB" stroke-width="2"/><text class="mono" x="325" y="490" fill="#2563EB" font-size="19" font-weight="900" text-anchor="middle">INTELLIGENCE / WATT</text><text class="ui" x="325" y="565" fill="#171717" font-size="22" font-weight="850" text-anchor="middle">average task accuracy</text><text class="mono" x="325" y="605" fill="#2563EB" font-size="18" font-weight="800" text-anchor="middle">-----------------------</text><text class="ui" x="325" y="650" fill="#171717" font-size="22" font-weight="850" text-anchor="middle">average power</text><rect x="610" y="430" width="390" height="270" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="805" y="480" fill="#2F7373" font-size="18" font-weight="900" text-anchor="middle">CURRENT V5 SCOPE</text><text class="ui" x="805" y="535" fill="#171717" font-size="20" font-weight="760" text-anchor="middle">20+ local models</text><text class="ui" x="805" y="575" fill="#171717" font-size="20" font-weight="760" text-anchor="middle">8 accelerators</text><text class="ui" x="805" y="615" fill="#171717" font-size="20" font-weight="760" text-anchor="middle">1M single-turn queries</text><rect x="1050" y="430" width="460" height="270" rx="8" fill="#FFF9E8" stroke="#8B7355" stroke-width="2"/><text class="mono" x="1280" y="480" fill="#8B7355" font-size="18" font-weight="900" text-anchor="middle">REPORTED</text><text class="ui" x="1280" y="540" fill="#171717" font-size="22" font-weight="850" text-anchor="middle">88.7% best-of-local</text><text class="ui" x="1280" y="580" fill="#171717" font-size="22" font-weight="850" text-anchor="middle">5.3x historical IPW</text><text class="ui" x="1280" y="620" fill="#B42318" font-size="19" font-weight="850" text-anchor="middle">local &gt;=1.4x lower IPW</text><rect x="330" y="750" width="940" height="90" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="348" y="777" fill="#B42318" font-size="14" font-weight="900" text-anchor="start">BOUNDARY</text><text class="ui" x="348" y="804" fill="#171717" font-size="18" font-weight="630" text-anchor="start">Versioned study results;
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" opacity=".38"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs><style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;letter-spacing:0}.mono{font-family:"SFMono-Regular","SF Mono",Consolas,monospace;letter-spacing:0}</style><rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity=".92"/><rect x="84" y="68" width="234" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="17" font-weight="900" text-anchor="start">RECURSIVE TRUST</text><rect x="1098" y="68" width="418" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1307" y="97" fill="#5E6670" font-size="15" font-weight="760" text-anchor="middle">PART 9  18:03-22:35 + DeepSeekMath-V2 v1</text><text class="ui" x="86" y="188" fill="#171717" font-size="50" font-weight="920" text-anchor="start">Verifier and</text><text class="ui" x="86" y="245" fill="#171717" font-size="50" font-weight="920" text-anchor="start">Meta-Verifier</text><text class="ui" x="90" y="320" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">Check the proof, then check the feedback that judged the proof.</text><rect x="140" y="485" width="280" height="140" rx="8" fill="#FFFCF4" stroke="#2563EB" stroke-width="2"/><text class="mono" x="280" y="545" fill="#2563EB" font-size="19" font-weight="900" text-anchor="middle">GENERATOR</text><text class="ui" x="280" y="587" fill="#171717" font-size="17" font-weight="700" text-anchor="middle">proof</text><rect x="550" y="360" width="280" height="140" rx="8" fill="#FFFCF4" stroke="#2F7373" stroke-width="2"/><text class="mono" x="690" y="420" fill="#2F7373" font-size="19" font-weight="900" text-anchor="middle">VERIFIER</text><text class="ui" x="690" y="462" fill="#171717" font-size="17" font-weight="700" text-anchor="middle">issue report</text><rect x="970" y="485" width="280" height="140" rx="8" fill="#FFFCF4" stroke="#722F37" stroke-width="2"/><text class="mono" x="1110" y="545" fill="#722F37" font-size="19" font-weight="900" text-anchor="middle">META-VERIFIER</text><text class="ui" x="1110" y="587" fill="#171717" font-size="17" font-weight="700" text-anchor="middle">check feedback</text><path d="M420 555 L550 465" fill="none" stroke="#2563EB" stroke-width="4"  marker-end="url(#arrow)"/><path d="M830 465 L970 535" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/><path d="M1110 625 C1000 760 440 760 280 625" fill="none" stroke="#722F37" stroke-width="4" marker-end="url(#arrow)"/><rect x="690" y="680" width="250" height="56" rx="8" fill="#FFF9E8" stroke="#8B7355" stroke-width="2"/><text class="mono" x="815" y="715" fill="#8B7355" font-size="17" font-weight="850" text-anchor="middle">hard examples</text><rect x="420" y="770" width="760" height="90" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="438" y="797" fill="#B42318" font-size="14" font-weight="900" text-anchor="start">BOUNDARY</text><text class="ui" x="438" y="824" fill="#171717" font-size="18" font-weight="630" text-anchor="start">A meta-verifier moves the trust boundary; it does not create</text><text class="ui" x="438" y="849" fill="#171717" font-size="18" font-weight="630" text-anchor="start">certainty.</text></svg>
    <rect x="86" y="66" width="254" height="42" rx="8" fill="#0F766E" opacity="0.12" stroke="#0F766E" stroke-width="1.5"/>
    <text class="mono" x="104" y="94" fill="#0F766E" font-size="19" font-weight="800">FAIRNESS AND POWER</text>
  </g>
    <text class="ui" x="86" y="185" fill="#1B1B1F" font-size="56" font-weight="850" text-anchor="start">Ambiguity</text><text class="ui" x="86" y="251" fill="#1B1B1F" font-size="56" font-weight="850" text-anchor="start">reallocates advantage</text>
    <text class="ui" x="90" y="347" fill="#666A73" font-size="27" font-weight="520" text-anchor="start">Unequal access becomes invisible when policy stays</text><text class="ui" x="90" y="382" fill="#666A73" font-size="27" font-weight="520" text-anchor="start">vague.</text><circle cx="112" cy="547" r="6" fill="#0F766E"/><text class="ui" x="136" y="555" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">Paid models and AI fluency</text><text class="ui" x="136" y="586" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">compound</text><circle cx="112" cy="625" r="6" fill="#0F766E"/><text class="ui" x="136" y="633" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">Students carry punishment risk</text><circle cx="112" cy="672" r="6" fill="#0F766E"/><text class="ui" x="136" y="680" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">Vendors gain data and</text><text class="ui" x="136" y="711" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">dependency</text><circle cx="112" cy="750" r="6" fill="#0F766E"/><text class="ui" x="136" y="758" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">Universities must define access</text><text class="ui" x="136" y="789" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">and appeals</text><path d="M1010 325 L790 445 M1010 325 L1230 445 M790 500 L990 630 M1230 500 L1030 630 M790 470 L1240 470" stroke="#BDB7AC" stroke-width="4" fill="none"/><g>
      <circle cx="1010" cy="295" r="72" fill="#15803D" opacity="0.12" stroke="#15803D" stroke-width="3"/>
      <text class="ui" x="1010" y="303" fill="#15803D" font-size="25" font-weight="900" text-anchor="middle">Student</text>
    </g><g>
      <circle cx="780" cy="470" r="72" fill="#2563EB" opacity="0.12" stroke="#2563EB" stroke-width="3"/>
      <text class="ui" x="780" y="478" fill="#2563EB" font-size="25" font-weight="900" text-anchor="middle">Teacher</text>
    </g><g>
      <circle cx="1240" cy="470" r="72" fill="#0F766E" opacity="0.12" stroke="#0F766E" stroke-width="3"/>
      <text class="ui" x="1240" y="478" fill="#0F766E" font-size="25" font-weight="900" text-anchor="middle">University</text>
    </g><g>
      <circle cx="1010" cy="650" r="72" fill="#B91C1C" opacity="0.12" stroke="#B91C1C" stroke-width="3"/>
      <text class="ui" x="1010" y="658" fill="#B91C1C" font-size="25" font-weight="900" text-anchor="middle">Vendor</text>

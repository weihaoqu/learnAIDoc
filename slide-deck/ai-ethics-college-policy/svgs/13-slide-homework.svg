  </g>
    <text class="ui" x="86" y="185" fill="#1B1B1F" font-size="56" font-weight="850" text-anchor="start">Homework: use AI</text><text class="ui" x="86" y="251" fill="#1B1B1F" font-size="56" font-weight="850" text-anchor="start">as a thinking partner</text>
    <text class="ui" x="90" y="347" fill="#666A73" font-size="27" font-weight="520" text-anchor="start">The final product must still prove student</text><text class="ui" x="90" y="382" fill="#666A73" font-size="27" font-weight="520" text-anchor="start">understanding.</text><circle cx="112" cy="552" r="6" fill="#0F766E"/><text class="ui" x="136" y="560" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">900-1200 word report</text><circle cx="112" cy="599" r="6" fill="#0F766E"/><text class="ui" x="136" y="607" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">Disclosure appendix</text><circle cx="112" cy="646" r="6" fill="#0F766E"/><text class="ui" x="136" y="654" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">Three prompt excerpts or</text><text class="ui" x="136" y="685" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">summaries</text><circle cx="112" cy="724" r="6" fill="#0F766E"/><text class="ui" x="136" y="732" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">Verification checklist</text><circle cx="112" cy="771" r="6" fill="#0F766E"/><text class="ui" x="136" y="779" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">Five-minute presentation</text><g transform="translate(720 235)">
    <rect x="0" y="0" width="570" height="470" rx="8" fill="#FFFFFF" stroke="#1B1B1F" stroke-width="2"/>
    <text class="ui" x="34" y="62" fill="#1B1B1F" font-size="32" font-weight="900">Assignment packet</text>
    <g><rect x="40" y="108" width="24" height="24" rx="5" fill="#0F766E" opacity="0.14" stroke="#0F766E" stroke-width="2"/><text class="ui" x="82" y="128" fill="#1B1B1F" font-size="24" font-weight="700">Final report</text></g><g><rect x="40" y="163" width="24" height="24" rx="5" fill="#0F766E" opacity="0.14" stroke="#0F766E" stroke-width="2"/><text class="ui" x="82" y="183" fill="#1B1B1F" font-size="24" font-weight="700">AI disclosure appendix</text></g><g><rect x="40" y="218" width="24" height="24" rx="5" fill="#0F766E" opacity="0.14" stroke="#0F766E" stroke-width="2"/><text class="ui" x="82" y="238" fill="#1B1B1F" font-size="24" font-weight="700">3 prompt excerpts / summaries</text></g><g><rect x="40" y="273" width="24" height="24" rx="5" fill="#0F766E" opacity="0.14" stroke="#0F766E" stroke-width="2"/><text class="ui" x="82" y="293" fill="#1B1B1F" font-size="24" font-weight="700">Source verification checklist</text></g><g><rect x="40" y="328" width="24" height="24" rx="5" fill="#0F766E" opacity="0.14" stroke="#0F766E" stroke-width="2"/><text class="ui" x="82" y="348" fill="#1B1B1F" font-size="24" font-weight="700">Reflection on learning</text></g><g><rect x="40" y="383" width="24" height="24" rx="5" fill="#0F766E" opacity="0.14" stroke="#0F766E" stroke-width="2"/><text class="ui" x="82" y="403" fill="#1B1B1F" font-size="24" font-weight="700">5-minute presentation</text></g>

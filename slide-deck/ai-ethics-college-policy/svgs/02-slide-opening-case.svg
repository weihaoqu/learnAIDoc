<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#DAD7CF" stroke-width="1" opacity="0.45"/>
    </pattern>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#0F766E"/>
    </marker>
  </defs>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Arial, sans-serif; letter-spacing: 0; }
    .mono { font-family: "SFMono-Regular", "SF Mono", Consolas, "Liberation Mono", Menlo, monospace; letter-spacing: 0; }
  </style>
  <rect width="1600" height="900" fill="#F6F4EE"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFFFF" opacity="0.74"/>
  <path d="M42 168 H1558" stroke="#BDB7AC" stroke-width="2"/>
  <g>
    <rect x="86" y="66" width="182" height="42" rx="8" fill="#0F766E" opacity="0.12" stroke="#0F766E" stroke-width="1.5"/>
    <text class="mono" x="104" y="94" fill="#0F766E" font-size="19" font-weight="800">OPENING CASE</text>
  </g>
    <text class="ui" x="86" y="185" fill="#1B1B1F" font-size="56" font-weight="850" text-anchor="start">One vague rule creates</text><text class="ui" x="86" y="251" fill="#1B1B1F" font-size="56" font-weight="850" text-anchor="start">three different classrooms</text>
    <text class="ui" x="90" y="347" fill="#666A73" font-size="27" font-weight="520" text-anchor="start">&quot;Use AI responsibly&quot; is not enough guidance.</text><circle cx="112" cy="537" r="6" fill="#0F766E"/><text class="ui" x="136" y="545" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">Paid-model advantage</text><circle cx="112" cy="584" r="6" fill="#0F766E"/><text class="ui" x="136" y="592" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">No-AI student faces time/access</text><text class="ui" x="136" y="623" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">tradeoff</text><circle cx="112" cy="662" r="6" fill="#0F766E"/><text class="ui" x="136" y="670" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">Unauthorized material upload</text><circle cx="112" cy="709" r="6" fill="#0F766E"/><text class="ui" x="136" y="717" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">Polished work, uncertain</text><text class="ui" x="136" y="748" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">learning</text><g>
    <rect x="760" y="238" width="320" height="160" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="760" y="238" width="320" height="54" rx="8" fill="#2563EB" opacity="0.11"/>
    <text class="ui" x="784" y="274" fill="#2563EB" font-size="24" font-weight="800">Student A</text>
    <text class="ui" x="784" y="333" fill="#1B1B1F" font-size="21" font-weight="540" text-anchor="start">Paid model; polished</text><text class="ui" x="784" y="363" fill="#1B1B1F" font-size="21" font-weight="540" text-anchor="start">report; weak defense</text>
  </g><g>
    <rect x="1120" y="238" width="320" height="160" rx="8" fill="#FFFFFF" stroke="#B7791F" stroke-width="2"/>
    <rect x="1120" y="238" width="320" height="54" rx="8" fill="#B7791F" opacity="0.11"/>
    <text class="ui" x="1144" y="274" fill="#B7791F" font-size="24" font-weight="800">Student B</text>
    <text class="ui" x="1144" y="333" fill="#1B1B1F" font-size="21" font-weight="540" text-anchor="start">No AI; slower work;</text><text class="ui" x="1144" y="363" fill="#1B1B1F" font-size="21" font-weight="540" text-anchor="start">possible disadvantage</text>
  </g><g>
    <rect x="760" y="448" width="320" height="160" rx="8" fill="#FFFFFF" stroke="#B91C1C" stroke-width="2"/>
    <rect x="760" y="448" width="320" height="54" rx="8" fill="#B91C1C" opacity="0.11"/>
    <text class="ui" x="784" y="484" fill="#B91C1C" font-size="24" font-weight="800">Student C</text>
    <text class="ui" x="784" y="543" fill="#1B1B1F" font-size="21" font-weight="540" text-anchor="start">Uploads course notes,</text><text class="ui" x="784" y="573" fill="#1B1B1F" font-size="21" font-weight="540" text-anchor="start">feedback, peer</text><text class="ui" x="784" y="603" fill="#1B1B1F" font-size="21" font-weight="540" text-anchor="start">comments</text>
  </g><g>
    <rect x="1120" y="448" width="320" height="160" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <rect x="1120" y="448" width="320" height="54" rx="8" fill="#0F766E" opacity="0.11"/>
    <text class="ui" x="1144" y="484" fill="#0F766E" font-size="24" font-weight="800">Professor</text>
    <text class="ui" x="1144" y="543" fill="#1B1B1F" font-size="21" font-weight="540" text-anchor="start">Good writing, vague</text><text class="ui" x="1144" y="573" fill="#1B1B1F" font-size="21" font-weight="540" text-anchor="start">disclosure, uncertain</text><text class="ui" x="1144" y="603" fill="#1B1B1F" font-size="21" font-weight="540" text-anchor="start">learning</text>
  </g>
</svg>
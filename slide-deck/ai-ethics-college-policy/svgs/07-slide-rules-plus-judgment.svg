<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#DAD7CF" stroke-width="1" opacity="0.45"/>
    </pattern>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#0F766E"/>
    </marker>
  </defs>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Arial, sans-serif; letter-spacing: 0; }
    .mono { font-family: "SFMono-Regular", "SF Mono", Consolas, "Liberation Mono", Menlo, monospace; letter-spacing: 0; }
  </style>
  <rect width="1600" height="900" fill="#F6F4EE"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFFFF" opacity="0.74"/>
  <path d="M42 168 H1558" stroke="#BDB7AC" stroke-width="2"/>
  <g>
    <rect x="86" y="66" width="230" height="42" rx="8" fill="#0F766E" opacity="0.12" stroke="#0F766E" stroke-width="1.5"/>
    <text class="mono" x="104" y="94" fill="#0F766E" font-size="19" font-weight="800">GIARMOLEO ET AL.</text>
  </g>
    <text class="ui" x="86" y="185" fill="#1B1B1F" font-size="56" font-weight="850" text-anchor="start">Clear rules are necessary;</text><text class="ui" x="86" y="251" fill="#1B1B1F" font-size="56" font-weight="850" text-anchor="start">trained judgment is necessary too</text>
    <text class="ui" x="90" y="347" fill="#666A73" font-size="27" font-weight="520" text-anchor="start">Act-centered and agent-centered</text><text class="ui" x="90" y="382" fill="#666A73" font-size="27" font-weight="520" text-anchor="start">responses belong together.</text><circle cx="112" cy="557" r="6" fill="#0F766E"/><text class="ui" x="136" y="565" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">Act-centered: policies,</text><text class="ui" x="136" y="596" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">standards, procedures</text><circle cx="112" cy="635" r="6" fill="#0F766E"/><text class="ui" x="136" y="643" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">Agent-centered: habits,</text><text class="ui" x="136" y="674" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">education, judgment</text><circle cx="112" cy="713" r="6" fill="#0F766E"/><text class="ui" x="136" y="721" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">Colleges need both to avoid</text><text class="ui" x="136" y="752" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">policing-only policy</text><g>
    <rect x="650" y="250" width="340" height="300" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="650" y="250" width="340" height="54" rx="8" fill="#2563EB" opacity="0.11"/>
    <text class="ui" x="674" y="286" fill="#2563EB" font-size="24" font-weight="800">Act-centered</text>
    <text class="ui" x="674" y="345" fill="#1B1B1F" font-size="21" font-weight="540" text-anchor="start">rules</text><text class="ui" x="674" y="375" fill="#1B1B1F" font-size="21" font-weight="540" text-anchor="start">standards</text><text class="ui" x="674" y="405" fill="#1B1B1F" font-size="21" font-weight="540" text-anchor="start">procedures</text><text class="ui" x="674" y="435" fill="#1B1B1F" font-size="21" font-weight="540" text-anchor="start">audits</text><text class="ui" x="674" y="465" fill="#1B1B1F" font-size="21" font-weight="540" text-anchor="start">privacy policy</text>
  </g><g>
    <rect x="1090" y="250" width="340" height="300" rx="8" fill="#FFFFFF" stroke="#15803D" stroke-width="2"/>
    <rect x="1090" y="250" width="340" height="54" rx="8" fill="#15803D" opacity="0.11"/>
    <text class="ui" x="1114" y="286" fill="#15803D" font-size="24" font-weight="800">Agent-centered</text>
    <text class="ui" x="1114" y="345" fill="#1B1B1F" font-size="21" font-weight="540" text-anchor="start">education</text><text class="ui" x="1114" y="375" fill="#1B1B1F" font-size="21" font-weight="540" text-anchor="start">habits</text><text class="ui" x="1114" y="405" fill="#1B1B1F" font-size="21" font-weight="540" text-anchor="start">case judgment</text><text class="ui" x="1114" y="435" fill="#1B1B1F" font-size="21" font-weight="540" text-anchor="start">verification</text><text class="ui" x="1114" y="465" fill="#1B1B1F" font-size="21" font-weight="540" text-anchor="start">disclosure culture</text>
  </g><g>
    <path d="M992 405 L1082 405" stroke="#0F766E" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="910" y="610" width="330" height="70" rx="8" fill="#0F766E" opacity="0.12" stroke="#0F766E" stroke-width="2"/>
    <text class="ui" x="1075" y="655" fill="#0F766E" font-size="27" font-weight="850" text-anchor="middle">college needs both</text>
  </g>
</svg>
    <text class="mono" x="104" y="94" fill="#0F766E" font-size="19" font-weight="800">REFRAME</text>
  </g>
    <text class="ui" x="86" y="185" fill="#1B1B1F" font-size="56" font-weight="850" text-anchor="start">&quot;Did they use AI?&quot;</text><text class="ui" x="86" y="251" fill="#1B1B1F" font-size="56" font-weight="850" text-anchor="start">is the wrong endpoint</text>
    <text class="ui" x="90" y="347" fill="#666A73" font-size="27" font-weight="520" text-anchor="start">The ethical target is accountable learning.</text><circle cx="112" cy="537" r="6" fill="#0F766E"/><text class="ui" x="136" y="545" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">Did the student learn?</text><circle cx="112" cy="584" r="6" fill="#0F766E"/><text class="ui" x="136" y="592" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">Can they defend the work?</text><circle cx="112" cy="631" r="6" fill="#0F766E"/><text class="ui" x="136" y="639" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">Was assistance disclosed?</text><circle cx="112" cy="678" r="6" fill="#0F766E"/><text class="ui" x="136" y="686" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">Was private material protected?</text><g transform="translate(730 250)">
    <rect x="0" y="0" width="360" height="250" rx="8" fill="#FFF8F6" stroke="#B91C1C" stroke-width="2"/>
    <text class="ui" x="180" y="92" fill="#B91C1C" font-size="30" font-weight="850" text-anchor="middle">Did they use AI?</text>
    <path d="M72 150 L288 150" stroke="#B91C1C" stroke-width="10" stroke-linecap="round"/>
    <text class="ui" x="180" y="204" fill="#666A73" font-size="23" text-anchor="middle">detection endpoint</text>
  </g><path d="M 1096 375 C 1109 375, 1109 375, 1122 375" fill="none" stroke="#0F766E" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><g transform="translate(1130 250)">
    <rect x="0" y="0" width="360" height="250" rx="8" fill="#F6FFF8" stroke="#15803D" stroke-width="2"/>
    <text class="ui" x="180" y="82" fill="#15803D" font-size="30" font-weight="850" text-anchor="middle">Did they learn?</text>
    <text class="ui" x="180" y="139" fill="#1B1B1F" font-size="24" font-weight="750" text-anchor="middle">explain</text>
    <text class="ui" x="180" y="181" fill="#1B1B1F" font-size="24" font-weight="750" text-anchor="middle">verify</text>
    <text class="ui" x="180" y="223" fill="#1B1B1F" font-size="24" font-weight="750" text-anchor="middle">defend</text>

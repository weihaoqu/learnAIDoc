<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#DAD7CF" stroke-width="1" opacity="0.45"/>
    </pattern>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#0F766E"/>
    </marker>
  </defs>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Arial, sans-serif; letter-spacing: 0; }
    .mono { font-family: "SFMono-Regular", "SF Mono", Consolas, "Liberation Mono", Menlo, monospace; letter-spacing: 0; }
  </style>
  <rect width="1600" height="900" fill="#F6F4EE"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFFFF" opacity="0.74"/>
  <path d="M42 168 H1558" stroke="#BDB7AC" stroke-width="2"/>
  <g>
    <rect x="86" y="66" width="230" height="42" rx="8" fill="#0F766E" opacity="0.12" stroke="#0F766E" stroke-width="1.5"/>
    <text class="mono" x="104" y="94" fill="#0F766E" font-size="19" font-weight="800">STUDENT BOUNDARY</text>
  </g>
    <text class="ui" x="86" y="185" fill="#1B1B1F" font-size="56" font-weight="850" text-anchor="start">The boundary</text><text class="ui" x="86" y="251" fill="#1B1B1F" font-size="56" font-weight="850" text-anchor="start">is learning labor</text>
    <text class="ui" x="90" y="347" fill="#666A73" font-size="27" font-weight="520" text-anchor="start">The question is whether the student can</text><text class="ui" x="90" y="382" fill="#666A73" font-size="27" font-weight="520" text-anchor="start">explain, verify, adapt, and defend.</text><circle cx="112" cy="547" r="6" fill="#0F766E"/><text class="ui" x="136" y="555" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">Allowed: discuss, plan,</text><text class="ui" x="136" y="586" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">revise, verify</text><circle cx="112" cy="625" r="6" fill="#0F766E"/><text class="ui" x="136" y="633" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">Borderline: AI proposes;</text><text class="ui" x="136" y="664" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">student owns</text><circle cx="112" cy="703" r="6" fill="#0F766E"/><text class="ui" x="136" y="711" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">Prohibited: AI completes;</text><text class="ui" x="136" y="742" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">student cannot explain</text><g>
      <rect x="650" y="235" width="760" height="104" rx="8" fill="#F6FFF8" stroke="#15803D" stroke-width="2"/>
      <text class="mono" x="690" y="292" fill="#15803D" font-size="28" font-weight="850">Allowed</text>
      <text class="ui" x="910" y="292" fill="#1B1B1F" font-size="25" font-weight="650">AI helps discuss, plan, revise, verify</text>
    </g><g>
      <rect x="650" y="385" width="760" height="104" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="2"/>
      <text class="mono" x="690" y="442" fill="#B7791F" font-size="28" font-weight="850">Borderline</text>
      <text class="ui" x="910" y="442" fill="#1B1B1F" font-size="25" font-weight="650">AI proposes; student owns and defends</text>
    </g><g>
      <rect x="650" y="535" width="760" height="104" rx="8" fill="#FFF7F7" stroke="#B91C1C" stroke-width="2"/>
      <text class="mono" x="690" y="592" fill="#B91C1C" font-size="28" font-weight="850">Prohibited</text>
      <text class="ui" x="910" y="592" fill="#1B1B1F" font-size="25" font-weight="650">AI completes; student cannot explain</text>
    </g><rect x="765" y="720" width="530" height="58" rx="8" fill="#0F766E" opacity="0.12" stroke="#0F766E" stroke-width="2"/><text class="ui" x="1030" y="758" fill="#0F766E" font-size="24" font-weight="850" text-anchor="middle">Can the student explain, verify, adapt, and defend?</text>
</svg>
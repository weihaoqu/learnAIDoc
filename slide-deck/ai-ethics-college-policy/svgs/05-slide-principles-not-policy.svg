  <g>
    <rect x="86" y="66" width="182" height="42" rx="8" fill="#0F766E" opacity="0.12" stroke="#0F766E" stroke-width="1.5"/>
    <text class="mono" x="104" y="94" fill="#0F766E" font-size="19" font-weight="800">JOBIN ET AL.</text>
  </g>
    <text class="ui" x="86" y="185" fill="#1B1B1F" font-size="56" font-weight="850" text-anchor="start">A principle</text><text class="ui" x="86" y="251" fill="#1B1B1F" font-size="56" font-weight="850" text-anchor="start">is not a policy</text>
    <text class="ui" x="90" y="347" fill="#666A73" font-size="27" font-weight="520" text-anchor="start">Shared ethics vocabulary still needs local</text><text class="ui" x="90" y="382" fill="#666A73" font-size="27" font-weight="520" text-anchor="start">implementation.</text><circle cx="112" cy="537" r="6" fill="#0F766E"/><text class="ui" x="136" y="545" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">Transparency: what must be</text><text class="ui" x="136" y="576" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">disclosed?</text><circle cx="112" cy="615" r="6" fill="#0F766E"/><text class="ui" x="136" y="623" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">Fairness: who gets access?</text><circle cx="112" cy="662" r="6" fill="#0F766E"/><text class="ui" x="136" y="670" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">Privacy: what cannot be</text><text class="ui" x="136" y="701" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">uploaded?</text><circle cx="112" cy="740" r="6" fill="#0F766E"/><text class="ui" x="136" y="748" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">Responsibility: who owns the</text><text class="ui" x="136" y="779" fill="#1B1B1F" font-size="24" font-weight="560" text-anchor="start">failure?</text><rect x="700" y="250" width="265" height="56" rx="8" fill="#0F766E" opacity="0.12" stroke="#0F766E" stroke-width="2"/><text class="mono" x="833" y="286" fill="#0F766E" font-size="21" font-weight="850" text-anchor="middle">transparency</text><rect x="700" y="336" width="265" height="56" rx="8" fill="#2563EB" opacity="0.12" stroke="#2563EB" stroke-width="2"/><text class="mono" x="833" y="372" fill="#2563EB" font-size="21" font-weight="850" text-anchor="middle">fairness</text><rect x="700" y="422" width="265" height="56" rx="8" fill="#B91C1C" opacity="0.12" stroke="#B91C1C" stroke-width="2"/><text class="mono" x="833" y="458" fill="#B91C1C" font-size="21" font-weight="850" text-anchor="middle">privacy</text><rect x="700" y="508" width="265" height="56" rx="8" fill="#B7791F" opacity="0.12" stroke="#B7791F" stroke-width="2"/><text class="mono" x="833" y="544" fill="#B7791F" font-size="21" font-weight="850" text-anchor="middle">responsibility</text><rect x="1080" y="250" width="330" height="56" rx="8" fill="#FBFAF7" stroke="#BDB7AC" stroke-width="2"/><text class="ui" x="1245" y="287" fill="#1B1B1F" font-size="23" font-weight="750" text-anchor="middle">what disclose?</text><rect x="1080" y="336" width="330" height="56" rx="8" fill="#FBFAF7" stroke="#BDB7AC" stroke-width="2"/><text class="ui" x="1245" y="373" fill="#1B1B1F" font-size="23" font-weight="750" text-anchor="middle">who gets access?</text><rect x="1080" y="422" width="330" height="56" rx="8" fill="#FBFAF7" stroke="#BDB7AC" stroke-width="2"/><text class="ui" x="1245" y="459" fill="#1B1B1F" font-size="23" font-weight="750" text-anchor="middle">what protect?</text><rect x="1080" y="508" width="330" height="56" rx="8" fill="#FBFAF7" stroke="#BDB7AC" stroke-width="2"/><text class="ui" x="1245" y="545" fill="#1B1B1F" font-size="23" font-weight="750" text-anchor="middle">who is accountable?</text><path d="M982 278 L1060 278" stroke="#0F766E" stroke-width="4" marker-end="url(#arrow)"/><path d="M982 364 L1060 364" stroke="#0F766E" stroke-width="4" marker-end="url(#arrow)"/><path d="M982 450 L1060 450" stroke="#0F766E" stroke-width="4" marker-end="url(#arrow)"/><path d="M982 536 L1060 536" stroke="#0F766E" stroke-width="4" marker-end="url(#arrow)"/>

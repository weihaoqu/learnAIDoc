<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" stroke-width="1" opacity="0.38"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker>
  </defs>
  <style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;letter-spacing:0}.mono{font-family:"SFMono-Regular","SF Mono",Consolas,monospace;letter-spacing:0}</style>
  <rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.88"/>
  <g><rect x="84" y="68" width="190" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="18" font-weight="850" text-anchor="start">METRICS</text></g><g><rect x="1082" y="68" width="434" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1299" y="97" fill="#5E6670" font-size="17" font-weight="760" text-anchor="middle">LECTURE 1  20:50-27:16 / 36:33-37:04</text></g><text class="ui" x="86" y="188" fill="#171717" font-size="54" font-weight="900" text-anchor="start">Coverage Is Not</text><text class="ui" x="86" y="250" fill="#171717" font-size="54" font-weight="900" text-anchor="start">Deployed Reliability</text><text class="ui" x="90" y="332" fill="#5E6670" font-size="25" font-weight="540" text-anchor="start">Finding a correct candidate does not guarantee returning it.</text><rect x="90" y="425" width="610" height="275" rx="8" fill="#F3F7FF" stroke="#2563EB" stroke-width="2"/><text class="mono" x="130" y="480" fill="#2563EB" font-size="22" font-weight="900" text-anchor="start">COVERAGE</text><text class="ui" x="130" y="540" fill="#171717" font-size="27" font-weight="750" text-anchor="start">Did any sampled candidate contain</text><text class="ui" x="130" y="575" fill="#171717" font-size="27" font-weight="750" text-anchor="start">the correct answer?</text><text class="mono" x="130" y="642" fill="#2563EB" font-size="34" font-weight="850" text-anchor="start">1 - (1 - p)^k</text><rect x="760" y="405" width="745" height="315" rx="8" fill="#FFFCF4" stroke="#722F37" stroke-width="2"/><text class="mono" x="802" y="455" fill="#722F37" font-size="22" font-weight="900" text-anchor="start">RELIABILITY</text><text class="mono" x="1290" y="455" fill="#5E6670" font-size="16" font-weight="760" text-anchor="middle">green = correct   red = selected</text><g><circle cx="830" cy="525" r="24" fill="#D8D0C0" opacity="0.7"/></g><g><circle cx="918" cy="525" r="24" fill="#D8D0C0" opacity="0.7"/></g><g><circle cx="1006" cy="525" r="24" fill="#D8D0C0" opacity="0.7"/></g><g><circle cx="1094" cy="525" r="24" fill="#D8D0C0" opacity="0.7"/></g><g><circle cx="1182" cy="525" r="24" fill="#D8D0C0" opacity="0.7"/></g><g><circle cx="1270" cy="525" r="24" fill="#D8D0C0" opacity="0.7"/></g><g><circle cx="830" cy="597" r="24" fill="#D8D0C0" opacity="0.7"/></g><g><circle cx="918" cy="597" r="24" fill="#D8D0C0" opacity="0.7"/></g><g><circle cx="1006" cy="597" r="24" fill="#16803C" opacity="1"/><text class="mono" x="1006" y="604" fill="#FFFFFF" font-size="14" font-weight="900" text-anchor="middle">OK</text></g><g><circle cx="1094" cy="597" r="24" fill="#D8D0C0" opacity="0.7"/></g><g><circle cx="1182" cy="597" r="24" fill="#D8D0C0" opacity="0.7"/></g><g><circle cx="1270" cy="597" r="24" fill="#D8D0C0" opacity="0.7"/></g><g><circle cx="830" cy="669" r="24" fill="#D8D0C0" opacity="0.7"/></g><g><circle cx="918" cy="669" r="24" fill="#D8D0C0" opacity="0.7"/></g><g><circle cx="1006" cy="669" r="24" fill="#D8D0C0" opacity="0.7"/></g><g><circle cx="1094" cy="669" r="24" fill="#B42318" opacity="1"/><text class="mono" x="1094" y="676" fill="#FFFFFF" font-size="12" font-weight="900" text-anchor="middle">SEL</text></g><g><circle cx="1182" cy="669" r="24" fill="#D8D0C0" opacity="0.7"/></g><g><circle cx="1270" cy="669" r="24" fill="#D8D0C0" opacity="0.7"/></g><g><rect x="310" y="758" width="980" height="100" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="330" y="787" fill="#B42318" font-size="16" font-weight="900" text-anchor="start">CAVEAT</text><text class="ui" x="330" y="819" fill="#171717" font-size="21" font-weight="620" text-anchor="start">Formula assumes independent, identical attempts. Real samples correlate,</text><text class="ui" x="330" y="847" fill="#171717" font-size="21" font-weight="620" text-anchor="start">and selectors make errors.</text></g></svg>
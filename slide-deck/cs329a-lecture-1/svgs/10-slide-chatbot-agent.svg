  <g><rect x="84" y="68" width="190" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="18" font-weight="850" text-anchor="start">AGENCY</text></g><g><rect x="1236" y="68" width="280" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1376" y="97" fill="#5E6670" font-size="17" font-weight="760" text-anchor="middle">LECTURE 1  40:49-43:26</text></g><text class="ui" x="86" y="188" fill="#171717" font-size="54" font-weight="900" text-anchor="start">An Agent Owns a</text><text class="ui" x="86" y="250" fill="#171717" font-size="54" font-weight="900" text-anchor="start">Goal-Directed Task Loop</text><text class="ui" x="90" y="332" fill="#5E6670" font-size="25" font-weight="540" text-anchor="start">Agency begins when feedback changes the next action.</text><g transform="translate(90 425)"><rect x="0" y="0" width="560" height="300" rx="8" fill="#FFFCF4" stroke="#8B7355" stroke-width="2"/><text class="mono" x="280" y="60" fill="#8B7355" font-size="23" font-weight="900" text-anchor="middle">CHATBOT</text><g><rect x="55" y="120" width="180" height="64" rx="8" fill="#FFFCF4" stroke="#8B7355" stroke-width="2"/><text class="ui" x="145" y="161" fill="#8B7355" font-size="25" font-weight="850" text-anchor="middle">Request</text></g><path d="M235 152 L325 152" fill="none" stroke="#8B7355" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="325" y="120" width="180" height="64" rx="8" fill="#FFFCF4" stroke="#8B7355" stroke-width="2"/><text class="ui" x="415" y="161" fill="#8B7355" font-size="25" font-weight="850" text-anchor="middle">Response</text></g><text class="ui" x="280" y="245" fill="#5E6670" font-size="22" font-weight="700" text-anchor="middle">human owns the task loop</text></g><g transform="translate(735 425)"><rect x="0" y="0" width="780" height="300" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="390" y="60" fill="#2F7373" font-size="23" font-weight="900" text-anchor="middle">AGENT</text><g><rect x="35" y="125" width="104" height="64" rx="8" fill="#FFFCF4" stroke="#2563EB" stroke-width="2"/><text class="ui" x="87" y="166" fill="#2563EB" font-size="25" font-weight="850" text-anchor="middle">Goal</text></g><path d="M139 157 L153 157" fill="none" stroke="#2F7373" stroke-width="3"  marker-end="url(#arrow)"/><g><rect x="157" y="125" width="104" height="64" rx="8" fill="#FFFCF4" stroke="#8B7355" stroke-width="2"/><text class="ui" x="209" y="166" fill="#8B7355" font-size="25" font-weight="850" text-anchor="middle">Plan</text></g><path d="M261 157 L275 157" fill="none" stroke="#2F7373" stroke-width="3"  marker-end="url(#arrow)"/><g><rect x="279" y="125" width="104" height="64" rx="8" fill="#FFFCF4" stroke="#722F37" stroke-width="2"/><text class="ui" x="331" y="166" fill="#722F37" font-size="25" font-weight="850" text-anchor="middle">Act</text></g><path d="M383 157 L397 157" fill="none" stroke="#2F7373" stroke-width="3"  marker-end="url(#arrow)"/><g><rect x="401" y="125" width="104" height="64" rx="8" fill="#FFFCF4" stroke="#2F7373" stroke-width="2"/><text class="ui" x="453" y="166" fill="#2F7373" font-size="25" font-weight="850" text-anchor="middle">Observe</text></g><path d="M505 157 L519 157" fill="none" stroke="#2F7373" stroke-width="3"  marker-end="url(#arrow)"/><g><rect x="523" y="125" width="104" height="64" rx="8" fill="#FFFCF4" stroke="#16803C" stroke-width="2"/><text class="ui" x="575" y="166" fill="#16803C" font-size="25" font-weight="850" text-anchor="middle">Correct</text></g><path d="M627 157 L641 157" fill="none" stroke="#2F7373" stroke-width="3"  marker-end="url(#arrow)"/><g><rect x="645" y="125" width="104" height="64" rx="8" fill="#FFFCF4" stroke="#171717" stroke-width="2"/><text class="ui" x="697" y="166" fill="#171717" font-size="25" font-weight="850" text-anchor="middle">Stop</text></g><text class="ui" x="390" y="245" fill="#171717" font-size="22" font-weight="750" text-anchor="middle">system owns a bounded goal-directed loop</text></g></svg>
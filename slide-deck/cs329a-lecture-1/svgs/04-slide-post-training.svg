<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" stroke-width="1" opacity="0.38"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker>
  </defs>
  <style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;letter-spacing:0}.mono{font-family:"SFMono-Regular","SF Mono",Consolas,monospace;letter-spacing:0}</style>
  <rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.88"/>
  <g><rect x="84" y="68" width="244" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="18" font-weight="850" text-anchor="start">BEHAVIOR SHAPING</text></g><g><rect x="1236" y="68" width="280" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1376" y="97" fill="#5E6670" font-size="17" font-weight="760" text-anchor="middle">LECTURE 1  11:20-19:25</text></g><text class="ui" x="86" y="188" fill="#171717" font-size="54" font-weight="900" text-anchor="start">Post-Training Turns Capability</text><text class="ui" x="86" y="250" fill="#171717" font-size="54" font-weight="900" text-anchor="start">into Assistant Behavior</text><text class="ui" x="90" y="332" fill="#5E6670" font-size="25" font-weight="540" text-anchor="start">Capability and behavioral alignment are related, but they are not the same</text><text class="ui" x="90" y="363" fill="#5E6670" font-size="25" font-weight="540" text-anchor="start">layer.</text><g><rect x="95" y="450" width="285" height="155" rx="8" fill="#FFFCF4" stroke="#2563EB" stroke-width="2"/><text class="mono" x="237" y="505" fill="#2563EB" font-size="20" font-weight="900" text-anchor="middle">PRETRAIN</text><text class="ui" x="237" y="557" fill="#171717" font-size="22" font-weight="680" text-anchor="middle">broad capability</text><path d="M380 528 L425 528" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/></g><g><rect x="430" y="450" width="285" height="155" rx="8" fill="#FFFCF4" stroke="#8B7355" stroke-width="2"/><text class="mono" x="572" y="505" fill="#8B7355" font-size="20" font-weight="900" text-anchor="middle">FINE-TUNE</text><text class="ui" x="572" y="557" fill="#171717" font-size="22" font-weight="680" text-anchor="middle">selected quality</text><path d="M715 528 L760 528" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/></g><g><rect x="765" y="450" width="285" height="155" rx="8" fill="#FFFCF4" stroke="#2F7373" stroke-width="2"/><text class="mono" x="907" y="505" fill="#2F7373" font-size="20" font-weight="900" text-anchor="middle">INSTRUCT</text><text class="ui" x="907" y="557" fill="#171717" font-size="22" font-weight="680" text-anchor="middle">request-response</text><path d="M1050 528 L1095 528" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/></g><g><rect x="1100" y="450" width="285" height="155" rx="8" fill="#FFFCF4" stroke="#722F37" stroke-width="2"/><text class="mono" x="1242" y="505" fill="#722F37" font-size="20" font-weight="900" text-anchor="middle">PREFERENCE</text><text class="ui" x="1242" y="557" fill="#171717" font-size="22" font-weight="680" text-anchor="middle">chosen criteria</text></g><g><rect x="470" y="665" width="660" height="128" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="490" y="694" fill="#B42318" font-size="16" font-weight="900" text-anchor="start">CAVEAT</text><text class="ui" x="490" y="726" fill="#171717" font-size="21" font-weight="620" text-anchor="start">Preference optimization approximates evaluator</text><text class="ui" x="490" y="754" fill="#171717" font-size="21" font-weight="620" text-anchor="start">preferences; it is not automatically a truth</text><text class="ui" x="490" y="782" fill="#171717" font-size="21" font-weight="620" text-anchor="start">detector.</text></g></svg>
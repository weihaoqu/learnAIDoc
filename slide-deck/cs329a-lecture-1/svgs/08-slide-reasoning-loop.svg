<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" stroke-width="1" opacity="0.38"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker>
  </defs>
  <style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;letter-spacing:0}.mono{font-family:"SFMono-Regular","SF Mono",Consolas,monospace;letter-spacing:0}</style>
  <rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.88"/>
  <g><rect x="84" y="68" width="190" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="18" font-weight="850" text-anchor="start">REASONING</text></g><g><rect x="1236" y="68" width="280" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1376" y="97" fill="#5E6670" font-size="17" font-weight="760" text-anchor="middle">LECTURE 1  31:22-40:43</text></g><text class="ui" x="86" y="188" fill="#171717" font-size="54" font-weight="900" text-anchor="start">Reasoning Models Turn</text><text class="ui" x="86" y="250" fill="#171717" font-size="54" font-weight="900" text-anchor="start">One Answer into a Search Process</text><text class="ui" x="90" y="332" fill="#5E6670" font-size="25" font-weight="540" text-anchor="start">A useful operational view is iterative search with feedback and backtracking.</text><text class="ui" x="105" y="495" fill="#171717" font-size="32" font-weight="800" text-anchor="start">Reasoning is useful when feedback</text><text class="ui" x="105" y="537" fill="#171717" font-size="32" font-weight="800" text-anchor="start">changes the next attempt.</text><g><rect x="100" y="635" width="500" height="100" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="120" y="664" fill="#B42318" font-size="16" font-weight="900" text-anchor="start">CAVEAT</text><text class="ui" x="120" y="696" fill="#171717" font-size="21" font-weight="620" text-anchor="start">A visible reasoning trace is not proof</text><text class="ui" x="120" y="724" fill="#171717" font-size="21" font-weight="620" text-anchor="start">that the reasoning is correct.</text></g><path d="M1085 442 L1190 495" fill="none" stroke="#2563EB" stroke-width="4"  marker-end="url(#arrow)"/><path d="M1220 565 L1160 660" fill="none" stroke="#8B7355" stroke-width="4"  marker-end="url(#arrow)"/><path d="M1015 685 L915 670" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/><path d="M820 615 L930 445" fill="none" stroke="#722F37" stroke-width="4"  marker-end="url(#arrow)"/><rect x="875" y="385" width="210" height="70" rx="8" fill="#FFFCF4" stroke="#2563EB" stroke-width="2"/><text class="ui" x="980" y="429" fill="#2563EB" font-size="24" font-weight="900" text-anchor="middle">Analyze</text><rect x="1145" y="495" width="210" height="70" rx="8" fill="#FFFCF4" stroke="#8B7355" stroke-width="2"/><text class="ui" x="1250" y="539" fill="#8B7355" font-size="24" font-weight="900" text-anchor="middle">Try</text><rect x="1015" y="665" width="210" height="70" rx="8" fill="#FFFCF4" stroke="#2F7373" stroke-width="2"/><text class="ui" x="1120" y="709" fill="#2F7373" font-size="24" font-weight="900" text-anchor="middle">Inspect</text><rect x="715" y="615" width="210" height="70" rx="8" fill="#FFFCF4" stroke="#722F37" stroke-width="2"/><text class="ui" x="820" y="659" fill="#722F37" font-size="24" font-weight="900" text-anchor="middle">Correct</text><path d="M820 650 L735 540" fill="none" stroke="#B42318" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/><rect x="620" y="470" width="170" height="70" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="705" y="513" fill="#B42318" font-size="17" font-weight="900" text-anchor="middle">BACKTRACK</text></svg>
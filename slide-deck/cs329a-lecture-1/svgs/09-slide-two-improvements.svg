<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" stroke-width="1" opacity="0.38"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker>
  </defs>
  <style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;letter-spacing:0}.mono{font-family:"SFMono-Regular","SF Mono",Consolas,monospace;letter-spacing:0}</style>
  <rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.88"/>
  <g><rect x="84" y="68" width="190" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="18" font-weight="850" text-anchor="start">PERSISTENCE</text></g><g><rect x="994" y="68" width="522" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1255" y="97" fill="#5E6670" font-size="17" font-weight="760" text-anchor="middle">LECTURE 1  28:53-30:12 + deck interpretation</text></g><text class="ui" x="86" y="188" fill="#171717" font-size="54" font-weight="900" text-anchor="start">Self-Improvement Has</text><text class="ui" x="86" y="250" fill="#171717" font-size="54" font-weight="900" text-anchor="start">Two Different Meanings</text><text class="ui" x="90" y="332" fill="#5E6670" font-size="25" font-weight="540" text-anchor="start">The key test is whether useful change survives beyond one task.</text><g transform="translate(90 425)"><rect x="0" y="0" width="650" height="300" rx="8" fill="#F3F7FF" stroke="#2563EB" stroke-width="2"/><text class="mono" x="40" y="55" fill="#2563EB" font-size="22" font-weight="900" text-anchor="start">WITHIN-RUN</text><text class="ui" x="40" y="110" fill="#171717" font-size="27" font-weight="780" text-anchor="start">retry -&gt; inspect -&gt; revise</text><path d="M120 190 L520 190" fill="none" stroke="#2563EB" stroke-width="4"  marker-end="url(#arrow)"/><path d="M520 220 L120 220" fill="none" stroke="#2563EB" stroke-width="4"  marker-end="url(#arrow)"/><text class="ui" x="325" y="270" fill="#5E6670" font-size="21" font-weight="650" text-anchor="middle">change disappears when the task ends</text></g><g transform="translate(865 425)"><rect x="0" y="0" width="650" height="300" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="40" y="55" fill="#2F7373" font-size="22" font-weight="900" text-anchor="start">ACROSS-RUN</text><text class="ui" x="40" y="110" fill="#171717" font-size="27" font-weight="780" text-anchor="start">learn -&gt; persist -&gt; reuse</text><g><rect x="40" y="150" width="175" height="64" rx="8" fill="#FFFCF4" stroke="#2F7373" stroke-width="2"/><text class="ui" x="127.5" y="191" fill="#2F7373" font-size="25" font-weight="850" text-anchor="middle">weights</text></g><g><rect x="235" y="150" width="175" height="64" rx="8" fill="#FFFCF4" stroke="#2F7373" stroke-width="2"/><text class="ui" x="322.5" y="191" fill="#2F7373" font-size="25" font-weight="850" text-anchor="middle">memory</text></g><g><rect x="430" y="150" width="175" height="64" rx="8" fill="#FFFCF4" stroke="#2F7373" stroke-width="2"/><text class="ui" x="517.5" y="191" fill="#2F7373" font-size="25" font-weight="850" text-anchor="middle">tools</text></g><g><rect x="40" y="225" width="175" height="64" rx="8" fill="#FFFCF4" stroke="#2F7373" stroke-width="2"/><text class="ui" x="127.5" y="266" fill="#2F7373" font-size="25" font-weight="850" text-anchor="middle">policies</text></g><g><rect x="235" y="225" width="175" height="64" rx="8" fill="#FFFCF4" stroke="#2F7373" stroke-width="2"/><text class="ui" x="322.5" y="266" fill="#2F7373" font-size="25" font-weight="850" text-anchor="middle">data</text></g></g><text class="mono" x="800" y="785" fill="#722F37" font-size="20" font-weight="900" text-anchor="middle">PERSISTENCE BOUNDARY</text><path d="M800 410 L800 755" fill="none" stroke="#722F37" stroke-width="3" stroke-dasharray="10 8" /></svg>
  <g><rect x="84" y="68" width="220" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="18" font-weight="850" text-anchor="start">DECK SYNTHESIS</text></g><g><rect x="1082" y="68" width="434" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1299" y="97" fill="#5E6670" font-size="17" font-weight="760" text-anchor="middle">LECTURE 1  02:23-19:38 / 40:49-47:55</text></g><text class="ui" x="86" y="188" fill="#171717" font-size="54" font-weight="900" text-anchor="start">One Way to Organize AI Progress:</text><text class="ui" x="86" y="250" fill="#171717" font-size="54" font-weight="900" text-anchor="start">Four Compute Frontiers</text><text class="ui" x="90" y="332" fill="#5E6670" font-size="25" font-weight="540" text-anchor="start">Each frontier improves a different part of the system.</text><g><rect x="105" y="465" width="285" height="220" rx="8" fill="#FFFCF4" stroke="#2563EB" stroke-width="2"/><text class="mono" x="133" y="510" fill="#2563EB" font-size="20" font-weight="900" text-anchor="start">01</text><text class="ui" x="133" y="560" fill="#2563EB" font-size="28" font-weight="900" text-anchor="start">Pretraining</text><text class="ui" x="133" y="615" fill="#171717" font-size="22" font-weight="650" text-anchor="start">What can it know?</text><path d="M390 575 L450 575" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/></g><g><rect x="470" y="465" width="285" height="220" rx="8" fill="#FFFCF4" stroke="#8B7355" stroke-width="2"/><text class="mono" x="498" y="510" fill="#8B7355" font-size="20" font-weight="900" text-anchor="start">02</text><text class="ui" x="498" y="560" fill="#8B7355" font-size="28" font-weight="900" text-anchor="start">Post-training</text><text class="ui" x="498" y="615" fill="#171717" font-size="22" font-weight="650" text-anchor="start">How should it</text><text class="ui" x="498" y="644" fill="#171717" font-size="22" font-weight="650" text-anchor="start">behave?</text><path d="M755 575 L815 575" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/></g><g><rect x="835" y="465" width="285" height="220" rx="8" fill="#FFFCF4" stroke="#722F37" stroke-width="2"/><text class="mono" x="863" y="510" fill="#722F37" font-size="20" font-weight="900" text-anchor="start">03</text><text class="ui" x="863" y="560" fill="#722F37" font-size="28" font-weight="900" text-anchor="start">Test-time</text><text class="ui" x="863" y="615" fill="#171717" font-size="22" font-weight="650" text-anchor="start">Which answer should</text><text class="ui" x="863" y="644" fill="#171717" font-size="22" font-weight="650" text-anchor="start">it choose?</text><path d="M1120 575 L1180 575" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/></g><g><rect x="1200" y="465" width="285" height="220" rx="8" fill="#FFFCF4" stroke="#2F7373" stroke-width="2"/><text class="mono" x="1228" y="510" fill="#2F7373" font-size="20" font-weight="900" text-anchor="start">04</text><text class="ui" x="1228" y="560" fill="#2F7373" font-size="28" font-weight="900" text-anchor="start">Orchestration</text><text class="ui" x="1228" y="615" fill="#171717" font-size="22" font-weight="650" text-anchor="start">What should it do</text><text class="ui" x="1228" y="644" fill="#171717" font-size="22" font-weight="650" text-anchor="start">next?</text></g><text class="mono" x="800" y="752" fill="#5E6670" font-size="22" font-weight="800" text-anchor="middle">CAPABILITY  -&gt;  BEHAVIOR  -&gt;  SEARCH  -&gt;  ACTION</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" stroke-width="1" opacity="0.38"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker>
  </defs>
  <style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;letter-spacing:0}.mono{font-family:"SFMono-Regular","SF Mono",Consolas,monospace;letter-spacing:0}</style>
  <rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.88"/>
  <g><rect x="84" y="68" width="190" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="18" font-weight="850" text-anchor="start">SCALING</text></g><g><rect x="1082" y="68" width="434" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1299" y="97" fill="#5E6670" font-size="17" font-weight="760" text-anchor="middle">LECTURE 1  02:23-10:49 / 58:12-60:32</text></g><text class="ui" x="86" y="188" fill="#171717" font-size="54" font-weight="900" text-anchor="start">Scaling Expanded Capability,</text><text class="ui" x="86" y="250" fill="#171717" font-size="54" font-weight="900" text-anchor="start">but Emergence Is Not a Free Pass</text><text class="ui" x="90" y="332" fill="#5E6670" font-size="25" font-weight="540" text-anchor="start">Historical evidence supports capability gains, not an unrestricted law of</text><text class="ui" x="90" y="363" fill="#5E6670" font-size="25" font-weight="540" text-anchor="start">emergence.</text><g transform="translate(90 435)"><rect x="0" y="0" width="650" height="295" rx="8" fill="#F3F7FF" stroke="#2563EB" stroke-width="2"/><text class="mono" x="34" y="48" fill="#2563EB" font-size="18" font-weight="900" text-anchor="start">OBSERVED ASSOCIATION</text><g><text class="mono" x="36" y="103" fill="#171717" font-size="19" font-weight="750">COMPUTE</text><rect x="210" y="82" width="360" height="24" rx="8" fill="#D8D0C0"/><rect x="210" y="82" width="280.8" height="24" rx="8" fill="#2563EB"/></g><g><text class="mono" x="36" y="168" fill="#171717" font-size="19" font-weight="750">DATA</text><rect x="210" y="147" width="360" height="24" rx="8" fill="#D8D0C0"/><rect x="210" y="147" width="237.60000000000002" height="24" rx="8" fill="#2563EB"/></g><g><text class="mono" x="36" y="233" fill="#171717" font-size="19" font-weight="750">PARAMETERS</text><rect x="210" y="212" width="360" height="24" rx="8" fill="#D8D0C0"/><rect x="210" y="212" width="309.6" height="24" rx="8" fill="#2563EB"/></g><text class="ui" x="355" y="273" fill="#171717" font-size="21" font-weight="720" text-anchor="middle">lower test loss + broader benchmark capability</text></g><g transform="translate(815 435)"><rect x="0" y="0" width="690" height="295" rx="8" fill="#FFFCF4" stroke="#722F37" stroke-width="2"/><text class="mono" x="34" y="48" fill="#722F37" font-size="18" font-weight="900" text-anchor="start">INTERPRETATION BOUNDARY</text><text class="ui" x="42" y="106" fill="#171717" font-size="24" font-weight="650" text-anchor="start">Larger models showed stronger few-shot and</text><text class="ui" x="42" y="138" fill="#171717" font-size="24" font-weight="650" text-anchor="start">chain-of-thought behavior on selected</text><text class="ui" x="42" y="170" fill="#171717" font-size="24" font-weight="650" text-anchor="start">benchmarks.</text><g><rect x="36" y="182" width="618" height="128" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="56" y="211" fill="#B42318" font-size="16" font-weight="900" text-anchor="start">CAVEAT</text><text class="ui" x="56" y="243" fill="#171717" font-size="21" font-weight="620" text-anchor="start">That observation does not prove a universal</text><text class="ui" x="56" y="271" fill="#171717" font-size="21" font-weight="620" text-anchor="start">law, nor that the behavior was absent from</text><text class="ui" x="56" y="299" fill="#171717" font-size="21" font-weight="620" text-anchor="start">training data.</text></g></g></svg>
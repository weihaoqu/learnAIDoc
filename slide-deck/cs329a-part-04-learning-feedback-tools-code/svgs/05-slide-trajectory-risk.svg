<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" stroke-width="1" opacity="0.38"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
  <style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;letter-spacing:0}.mono{font-family:"SFMono-Regular","SF Mono",Consolas,monospace;letter-spacing:0}</style>
  <rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.9"/><rect x="84" y="68" width="234" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="17" font-weight="900" text-anchor="start">TRAJECTORY RISK</text><rect x="1115" y="68" width="401" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1315.5" y="97" fill="#5E6670" font-size="15" font-weight="780" text-anchor="middle">PART 4  18:37-27:32 + arXiv:2210.03629</text><text class="ui" x="86" y="188" fill="#171717" font-size="52" font-weight="920" text-anchor="start">One Early Error Can Contaminate</text><text class="ui" x="86" y="247" fill="#171717" font-size="52" font-weight="920" text-anchor="start">the Whole Trajectory</text><text class="ui" x="90" y="326" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">Longer loops create more chances to recover and more chances to compound a mistake.</text><rect x="115" y="485" width="170" height="100" rx="8" fill="#F3F7FF" stroke="#2563EB" stroke-width="2"/><text class="mono" x="200" y="528" fill="#2563EB" font-size="15" font-weight="900" text-anchor="middle">01</text><text class="mono" x="200" y="562" fill="#2563EB" font-size="18" font-weight="900" text-anchor="middle">THINK</text><path d="M285 535 L355 535" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><rect x="355" y="485" width="170" height="100" rx="8" fill="#F3F7FF" stroke="#2563EB" stroke-width="2"/><text class="mono" x="440" y="528" fill="#2563EB" font-size="15" font-weight="900" text-anchor="middle">02</text><text class="mono" x="440" y="562" fill="#2563EB" font-size="18" font-weight="900" text-anchor="middle">SEARCH</text><path d="M525 535 L595 535" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><rect x="595" y="485" width="170" height="100" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="680" y="528" fill="#B42318" font-size="15" font-weight="900" text-anchor="middle">03</text><text class="mono" x="680" y="562" fill="#B42318" font-size="18" font-weight="900" text-anchor="middle">OBSERVE</text><path d="M765 535 L835 535" fill="none" stroke="#B42318" stroke-width="3"  marker-end="url(#arrow)"/><rect x="835" y="485" width="170" height="100" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="920" y="528" fill="#B42318" font-size="15" font-weight="900" text-anchor="middle">04</text><text class="mono" x="920" y="562" fill="#B42318" font-size="18" font-weight="900" text-anchor="middle">UPDATE</text><path d="M1005 535 L1075 535" fill="none" stroke="#B42318" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1075" y="485" width="170" height="100" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="1160" y="528" fill="#B42318" font-size="15" font-weight="900" text-anchor="middle">05</text><text class="mono" x="1160" y="562" fill="#B42318" font-size="18" font-weight="900" text-anchor="middle">ACT</text><path d="M1245 535 L1315 535" fill="none" stroke="#B42318" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1315" y="485" width="170" height="100" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="1400" y="528" fill="#B42318" font-size="15" font-weight="900" text-anchor="middle">06</text><text class="mono" x="1400" y="562" fill="#B42318" font-size="18" font-weight="900" text-anchor="middle">ANSWER</text><text class="ui" x="680" y="450" fill="#B42318" font-size="19" font-weight="850" text-anchor="middle">misleading observation enters state</text><path d="M1130 585 C1130 760 430 760 430 585" fill="none" stroke="#2F7373" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/><g><rect x="620" y="700" width="330" height="54" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="785" y="734" fill="#2F7373" font-size="18" font-weight="850" text-anchor="middle">BACKTRACK + RECHECK</text></g><rect x="430" y="790" width="740" height="90" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="448" y="816" fill="#B42318" font-size="14" font-weight="900" text-anchor="start">CAVEAT</text><text class="ui" x="448" y="842" fill="#171717" font-size="18" font-weight="640" text-anchor="start">Longer trajectories add both recovery opportunities and</text><text class="ui" x="448" y="867" fill="#171717" font-size="18" font-weight="640" text-anchor="start">failure surface.</text></svg>
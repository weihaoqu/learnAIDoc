  <rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.9"/><rect x="84" y="68" width="270" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="17" font-weight="900" text-anchor="start">NORMATIVE FEEDBACK</text><rect x="1162.5" y="68" width="353.5" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1339.25" y="97" fill="#5E6670" font-size="15" font-weight="780" text-anchor="middle">PART 4  46:30-50:42 / 53:20-57:14</text><text class="ui" x="86" y="188" fill="#171717" font-size="52" font-weight="920" text-anchor="start">A Constitution Makes Normative</text><text class="ui" x="86" y="247" fill="#171717" font-size="52" font-weight="920" text-anchor="start">Feedback Inspectable</text><text class="ui" x="90" y="326" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">Human-written principles guide an AI critic, but they do not remove human judgment.</text><rect x="105" y="435" width="380" height="82" rx="8" fill="#FFF9E8" stroke="#8B7355" stroke-width="2"/><text class="mono" x="130" y="467" fill="#8B7355" font-size="16" font-weight="900" text-anchor="start">TOPIC 1</text><text class="ui" x="187" y="486" fill="#171717" font-size="18" font-weight="680" text-anchor="start">harm</text><rect x="105" y="545" width="380" height="82" rx="8" fill="#FFF9E8" stroke="#8B7355" stroke-width="2"/><text class="mono" x="130" y="577" fill="#8B7355" font-size="16" font-weight="900" text-anchor="start">TOPIC 2</text><text class="ui" x="187" y="596" fill="#171717" font-size="18" font-weight="680" text-anchor="start">social bias</text><rect x="105" y="655" width="380" height="82" rx="8" fill="#FFF9E8" stroke="#8B7355" stroke-width="2"/><text class="mono" x="130" y="687" fill="#8B7355" font-size="16" font-weight="900" text-anchor="start">TOPIC 3</text><text class="ui" x="187" y="706" fill="#171717" font-size="18" font-weight="680" text-anchor="start">age context</text><text class="mono" x="295" y="405" fill="#8B7355" font-size="17" font-weight="900" text-anchor="middle">ILLUSTRATIVE PRINCIPLE TOPICS</text><path d="M485 585 L650 585" fill="none" stroke="#8B7355" stroke-width="5"  marker-end="url(#arrow)"/><rect x="650" y="475" width="300" height="220" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="800" y="517" fill="#2F7373" font-size="20" font-weight="900" text-anchor="middle">AI CRITIC</text><text class="ui" x="800" y="553" fill="#171717" font-size="18" font-weight="650" text-anchor="middle">critique or compare</text><text class="ui" x="800" y="577" fill="#171717" font-size="18" font-weight="650" text-anchor="middle">responses under a</text><text class="ui" x="800" y="601" fill="#171717" font-size="18" font-weight="650" text-anchor="middle">selected principle</text><path d="M950 585 L1110 585" fill="none" stroke="#2F7373" stroke-width="5"  marker-end="url(#arrow)"/><rect x="1110" y="465" width="300" height="110" rx="8" fill="#F3F7FF" stroke="#2563EB" stroke-width="2"/><text class="mono" x="1260" y="507" fill="#2563EB" font-size="20" font-weight="900" text-anchor="middle">PREFERENCE</text><text class="ui" x="1260" y="543" fill="#171717" font-size="18" font-weight="650" text-anchor="middle">which response better</text><text class="ui" x="1260" y="567" fill="#171717" font-size="18" font-weight="650" text-anchor="middle">follows the</text><text class="ui" x="1260" y="591" fill="#171717" font-size="18" font-weight="650" text-anchor="middle">principle?</text><rect x="1110" y="615" width="300" height="110" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="3"/><text class="mono" x="1260" y="655" fill="#B42318" font-size="18" font-weight="900" text-anchor="middle">OPEN VALUE SLOT</text><text class="ui" x="1260" y="692" fill="#171717" font-size="17" font-weight="650" text-anchor="middle">omitted / conflicting</text><rect x="470" y="785" width="660" height="90" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="488" y="811" fill="#B42318" font-size="14" font-weight="900" text-anchor="start">CAVEAT</text><text class="ui" x="488" y="837" fill="#171717" font-size="18" font-weight="640" text-anchor="start">Topic labels are illustrative paraphrases;</text><text class="ui" x="488" y="862" fill="#171717" font-size="18" font-weight="640" text-anchor="start">principles remain human choices.</text></svg>
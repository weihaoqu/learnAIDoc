<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" stroke-width="1" opacity="0.38"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>
  <style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;letter-spacing:0}.mono{font-family:"SFMono-Regular","SF Mono",Consolas,monospace;letter-spacing:0}</style>
  <rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.9"/><rect x="84" y="68" width="258" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="17" font-weight="900" text-anchor="start">EVIDENCE BOUNDARY</text><rect x="1162.5" y="68" width="353.5" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1339.25" y="97" fill="#5E6670" font-size="15" font-weight="780" text-anchor="middle">PART 4  09:07-12:54 / 18:37-20:04</text><text class="ui" x="86" y="188" fill="#171717" font-size="52" font-weight="920" text-anchor="start">A Tool Observation Is Evidence,</text><text class="ui" x="86" y="247" fill="#171717" font-size="52" font-weight="920" text-anchor="start">Not Truth</text><text class="ui" x="90" y="326" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">Retrieval can be relevant or misleading; interpretation still determines the state</text><text class="ui" x="90" y="355" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">update.</text><rect x="100" y="425" width="300" height="76" rx="8" fill="#FFFCF4" stroke="#16803C" stroke-width="2"/><text class="mono" x="130" y="456" fill="#16803C" font-size="16" font-weight="900" text-anchor="start">PACKET A</text><text class="ui" x="130" y="485" fill="#171717" font-size="17" font-weight="650" text-anchor="start">current + relevant</text><rect x="100" y="535" width="300" height="76" rx="8" fill="#FFFCF4" stroke="#B42318" stroke-width="2"/><text class="mono" x="130" y="566" fill="#B42318" font-size="16" font-weight="900" text-anchor="start">PACKET B</text><text class="ui" x="130" y="595" fill="#171717" font-size="17" font-weight="650" text-anchor="start">true + irrelevant</text><rect x="100" y="645" width="300" height="76" rx="8" fill="#FFFCF4" stroke="#722F37" stroke-width="2"/><text class="mono" x="130" y="676" fill="#722F37" font-size="16" font-weight="900" text-anchor="start">PACKET C</text><text class="ui" x="130" y="705" fill="#171717" font-size="17" font-weight="650" text-anchor="start">stale + plausible</text><path d="M400 463 L530 463" fill="none" stroke="#16803C" stroke-width="4"  marker-end="url(#arrow)"/><path d="M400 573 L530 573" fill="none" stroke="#B42318" stroke-width="4"  marker-end="url(#arrow)"/><path d="M400 683 L530 683" fill="none" stroke="#722F37" stroke-width="4"  marker-end="url(#arrow)"/><rect x="530" y="430" width="270" height="250" rx="8" fill="#FFF9E8" stroke="#8B7355" stroke-width="2"/><text class="mono" x="665" y="472" fill="#8B7355" font-size="20" font-weight="900" text-anchor="middle">PROVENANCE</text><text class="ui" x="665" y="508" fill="#171717" font-size="18" font-weight="650" text-anchor="middle">source, recency,</text><text class="ui" x="665" y="532" fill="#171717" font-size="18" font-weight="650" text-anchor="middle">identity</text><path d="M800 555 L910 555" fill="none" stroke="#8B7355" stroke-width="5"  marker-end="url(#arrow)"/><rect x="910" y="430" width="270" height="250" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="1045" y="472" fill="#2F7373" font-size="20" font-weight="900" text-anchor="middle">RELEVANCE</text><text class="ui" x="1045" y="508" fill="#171717" font-size="18" font-weight="650" text-anchor="middle">does this answer</text><text class="ui" x="1045" y="532" fill="#171717" font-size="18" font-weight="650" text-anchor="middle">the current need?</text><path d="M1180 555 L1290 555" fill="none" stroke="#2F7373" stroke-width="5"  marker-end="url(#arrow)"/><rect x="1290" y="430" width="220" height="250" rx="8" fill="#F3F7FF" stroke="#2563EB" stroke-width="2"/><text class="mono" x="1400" y="472" fill="#2563EB" font-size="20" font-weight="900" text-anchor="middle">INTERPRET</text><text class="ui" x="1400" y="508" fill="#171717" font-size="18" font-weight="650" text-anchor="middle">update state</text><text class="ui" x="1400" y="532" fill="#171717" font-size="18" font-weight="650" text-anchor="middle">with</text><text class="ui" x="1400" y="556" fill="#171717" font-size="18" font-weight="650" text-anchor="middle">uncertainty</text><path d="M530 573 C475 573 475 740 650 740" fill="none" stroke="#B42318" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><g><rect x="650" y="713" width="275" height="54" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="787.5" y="747" fill="#B42318" font-size="18" font-weight="850" text-anchor="middle">REJECT / ESCALATE</text></g><rect x="925" y="735" width="585" height="90" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="943" y="761" fill="#B42318" font-size="14" font-weight="900" text-anchor="start">CAVEAT</text><text class="ui" x="943" y="787" fill="#171717" font-size="18" font-weight="640" text-anchor="start">A correct retrieval can still produce a wrong</text><text class="ui" x="943" y="812" fill="#171717" font-size="18" font-weight="640" text-anchor="start">state update.</text></svg>
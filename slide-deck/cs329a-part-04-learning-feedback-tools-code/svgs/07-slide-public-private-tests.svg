hor="middle">PUBLIC TESTS</text><text class="ui" x="580" y="593" fill="#171717" font-size="18" font-weight="650" text-anchor="middle">pass / fail +</text><text class="ui" x="580" y="617" fill="#171717" font-size="18" font-weight="650" text-anchor="middle">errors</text><path d="M580 650 C580 720 245 720 245 650" fill="none" stroke="#2F7373" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><g><rect x="715" y="550" width="150" height="54" rx="8" fill="#FFFCF4" stroke="#722F37" stroke-width="2"/><text class="mono" x="790" y="584" fill="#722F37" font-size="18" font-weight="850" text-anchor="middle">REPAIR</text></g><rect x="950" y="405" width="70" height="370" rx="8" fill="#FFF5F3" stroke="#722F37" stroke-width="2"/><text class="mono" x="985" y="460" fill="#722F37" font-size="16" font-weight="900" text-anchor="middle">H</text><text class="mono" x="985" y="494" fill="#722F37" font-size="16" font-weight="900" text-anchor="middle">I</text><text class="mono" x="985" y="528" fill="#722F37" font-size="16" font-weight="900" text-anchor="middle">D</text><text class="mono" x="985" y="562" fill="#722F37" font-size="16" font-weight="900" text-anchor="middle">D</text><text class="mono" x="985" y="596" fill="#722F37" font-size="16" font-weight="900" text-anchor="middle">E</text><text class="mono" x="985" y="630" fill="#722F37" font-size="16" font-weight="900" text-anchor="middle">N</text><rect x="1060" y="420" width="455" height="340" rx="8" fill="#FFF9E8" stroke="#8B7355" stroke-width="2"/><text class="mono" x="1100" y="462" fill="#8B7355" font-size="18" font-weight="900" text-anchor="start">TERMINAL SIGNAL</text><rect x="1110" y="520" width="210" height="130" rx="8" fill="#FFFCF4" stroke="#8B7355" stroke-width="2"/><text class="mono" x="1215" y="562" fill="#8B7355" font-size="20" font-weight="900" text-anchor="middle">PRIVATE TESTS</text><text class="ui" x="1215" y="598" fill="#171717" font-size="18" font-weight="650" text-anchor="middle">held out from</text><text 
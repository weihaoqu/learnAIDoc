<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" stroke-width="1" opacity="0.38"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;letter-spacing:0}.mono{font-family:"SFMono-Regular","SF Mono",Consolas,monospace;letter-spacing:0}</style><rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.92"/><rect x="84" y="68" width="270" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="17" font-weight="900" text-anchor="start">DAPO STABILIZATION</text><rect x="1231" y="68" width="285" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1373.5" y="97" fill="#5E6670" font-size="15" font-weight="780" text-anchor="middle">PART 6  53:05-61:49</text><text class="ui" x="86" y="188" fill="#171717" font-size="52" font-weight="920" text-anchor="start">DAPO Stabilizes RL</text><text class="ui" x="86" y="247" fill="#171717" font-size="52" font-weight="920" text-anchor="start">With Four Coupled Controls</text><text class="ui" x="90" y="326" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">Clip-Higher, dynamic sampling, token-level loss, and overlong reward shaping form one</text><text class="ui" x="90" y="355" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">cumulative recipe.</text><rect x="75" y="440" width="260" height="240" rx="8" fill="#F3F7FF" stroke="#2563EB" stroke-width="2"/><text class="mono" x="103" y="480" fill="#2563EB" font-size="15" font-weight="900" text-anchor="start">01</text><text class="ui" x="103" y="535" fill="#2563EB" font-size="19" font-weight="900" text-anchor="start">CLIP-HIGHER</text><text class="ui" x="103" y="620" fill="#171717" font-size="17" font-weight="720" text-anchor="start">protect exploration</text><rect x="375" y="440" width="260" height="240" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="403" y="480" fill="#2F7373" font-size="15" font-weight="900" text-anchor="start">02</text><text class="ui" x="403" y="535" fill="#2F7373" font-size="19" font-weight="900" text-anchor="start">DYNAMIC SAMPLE</text><text class="ui" x="403" y="620" fill="#171717" font-size="17" font-weight="720" text-anchor="start">keep reward variation</text><rect x="675" y="440" width="260" height="240" rx="8" fill="#FFF9E8" stroke="#8B7355" stroke-width="2"/><text class="mono" x="703" y="480" fill="#8B7355" font-size="15" font-weight="900" text-anchor="start">03</text><text class="ui" x="703" y="535" fill="#8B7355" font-size="19" font-weight="900" text-anchor="start">TOKEN LOSS</text><text class="ui" x="703" y="620" fill="#171717" font-size="17" font-weight="720" text-anchor="start">balance response</text><text class="ui" x="703" y="641" fill="#171717" font-size="17" font-weight="720" text-anchor="start">lengths</text><rect x="975" y="440" width="260" height="240" rx="8" fill="#FFF5F3" stroke="#722F37" stroke-width="2"/><text class="mono" x="1003" y="480" fill="#722F37" font-size="15" font-weight="900" text-anchor="start">04</text><text class="ui" x="1003" y="535" fill="#722F37" font-size="19" font-weight="900" text-anchor="start">OVERLONG SHAPE</text><text class="ui" x="1003" y="620" fill="#171717" font-size="17" font-weight="720" text-anchor="start">bound truncation</text><rect x="1280" y="410" width="240" height="300" rx="8" fill="#F2FBF8" stroke="#16803C" stroke-width="2"/><text class="mono" x="1400" y="455" fill="#16803C" font-size="17" font-weight="900" text-anchor="middle">PAPER SETUP</text><text class="mono" x="1400" y="525" fill="#171717" font-size="33" font-weight="930" text-anchor="middle">30 -&gt; 50</text><text class="mono" x="1400" y="570" fill="#16803C" font-size="16" font-weight="900" text-anchor="middle">AIME24 avg@32</text><text class="mono" x="1400" y="620" fill="#5E6670" font-size="16" font-weight="750" text-anchor="middle">Qwen2.5-32B</text><text class="ui" x="1400" y="670" fill="#5E6670" font-size="16" font-weight="750" text-anchor="middle">cumulative recipe</text><rect x="300" y="760" width="1000" height="92" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="320" y="787" fill="#B42318" font-size="14" font-weight="900" text-anchor="start">CAVEAT</text><text class="ui" x="320" y="814" fill="#171717" font-size="18" font-weight="640" text-anchor="start">Setup-specific cumulative result; it is not a universal threshold or an</text><text class="ui" x="320" y="839" fill="#171717" font-size="18" font-weight="640" text-anchor="start">isolated effect of one control.</text></svg>
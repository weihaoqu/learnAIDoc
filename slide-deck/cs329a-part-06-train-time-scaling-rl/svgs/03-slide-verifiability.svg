<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" stroke-width="1" opacity="0.38"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;letter-spacing:0}.mono{font-family:"SFMono-Regular","SF Mono",Consolas,monospace;letter-spacing:0}</style><rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.92"/><rect x="84" y="68" width="282" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="17" font-weight="900" text-anchor="start">FEEDBACK BOTTLENECK</text><rect x="1231" y="68" width="285" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1373.5" y="97" fill="#5E6670" font-size="15" font-weight="780" text-anchor="middle">PART 6  05:43-11:31</text><text class="ui" x="86" y="188" fill="#171717" font-size="52" font-weight="920" text-anchor="start">Verifiability Is</text><text class="ui" x="86" y="247" fill="#171717" font-size="52" font-weight="920" text-anchor="start">the Feedback Bottleneck</text><text class="ui" x="90" y="326" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">A correct final answer can create scalable signal without validating the rationale,</text><text class="ui" x="90" y="355" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">behavior, or tool path.</text><rect x="80" y="420" width="575" height="300" rx="8" fill="#F3F7FF" stroke="#2563EB" stroke-width="2"/><text class="mono" x="367" y="465" fill="#2563EB" font-size="19" font-weight="900" text-anchor="middle">MODEL TRAJECTORY</text><g><rect x="125" y="530" width="170" height="54" rx="8" fill="#FFFCF4" stroke="#2563EB" stroke-width="2"/><text class="mono" x="210" y="565" fill="#2563EB" font-size="17" font-weight="850" text-anchor="middle">RATIONALE</text></g><path d="M295 557 L410 557" fill="none" stroke="#2563EB" stroke-width="4"  marker-end="url(#arrow)"/><g><rect x="410" y="530" width="170" height="54" rx="8" fill="#FFFCF4" stroke="#2563EB" stroke-width="2"/><text class="mono" x="495" y="565" fill="#2563EB" font-size="17" font-weight="850" text-anchor="middle">ANSWER</text></g><text class="ui" x="367" y="665" fill="#5E6670" font-size="18" font-weight="700" text-anchor="middle">reasoning remains opaque</text><path d="M655 570 L790 570" fill="none" stroke="#2F7373" stroke-width="5"  marker-end="url(#arrow)"/><rect x="790" y="440" width="320" height="260" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="950" y="488" fill="#2F7373" font-size="18" font-weight="900" text-anchor="middle">OUTCOME CHECKER</text><text class="mono" x="950" y="560" fill="#171717" font-size="25" font-weight="900" text-anchor="middle">answer == key</text><g><rect x="850" y="615" width="200" height="54" rx="8" fill="#FFFCF4" stroke="#16803C" stroke-width="2"/><text class="mono" x="950" y="650" fill="#16803C" font-size="17" font-weight="850" text-anchor="middle">SCALABLE SIGNAL</text></g><path d="M1110 570 L1220 570" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/><rect x="1220" y="420" width="300" height="300" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="1370" y="470" fill="#B42318" font-size="18" font-weight="900" text-anchor="middle">NOT CERTIFIED</text><text class="ui" x="1260" y="530" fill="#171717" font-size="21" font-weight="760" text-anchor="start">faithful rationale</text><text class="ui" x="1260" y="575" fill="#171717" font-size="21" font-weight="760" text-anchor="start">safe behavior</text><text class="ui" x="1260" y="620" fill="#171717" font-size="21" font-weight="760" text-anchor="start">valid tool path</text><rect x="385" y="770" width="830" height="92" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="405" y="797" fill="#B42318" font-size="14" font-weight="900" text-anchor="start">CAVEAT</text><text class="ui" x="405" y="824" fill="#171717" font-size="18" font-weight="640" text-anchor="start">Outcome verification creates useful signal, but it does not</text><text class="ui" x="405" y="849" fill="#171717" font-size="18" font-weight="640" text-anchor="start">certify the process that produced the answer.</text></svg>
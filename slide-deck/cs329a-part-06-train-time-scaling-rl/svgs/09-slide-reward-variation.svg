 x="800" y="635" fill="#171717" font-size="22" font-weight="850" text-anchor="middle">LEARNING SIGNAL</text><text class="ui" x="800" y="680" fill="#5E6670" font-size="17" font-weight="700" text-anchor="middle">nonzero advantages</text><rect x="1095" y="430" width="430" height="300" rx="8" fill="#F2FBF8" stroke="#16803C" stroke-width="2"/><text class="mono" x="1310" y="474" fill="#16803C" font-size="18" font-weight="900" text-anchor="middle">ALL CORRECT</text><circle cx="1180" cy="555" r="30" fill="#16803C" opacity="0.88"/><text class="mono" x="1180" y="562" fill="#FFFCF4" font-size="17" font-weight="900" text-anchor="middle">1</text><circle cx="1265" cy="555" r="30" fill="#16803C" opacity="0.88"/><text class="mono" x="1265" y="562" fill="#FFFCF4" font-size="17" font-weight="900" text-anchor="middle">1</text><circle cx="1350" cy="555" r="30" fill="#16803C" opacity="0.88"/><text class="mono" x="1350" y="562" fill="#FFFCF4" font-size="17" font-weight="900" text-anchor="middle">1</text><circle cx="1435" cy="555" r="30" fill="#16803C" opacity="0.88"/><text class="mono" x="1435" y="562" fill="#FFFCF4" font-size="17" font-weight="900" text-anchor="middle">1</text><text class="ui" x="1310" y="635" fill="#171717" font-size="22" font-weight="850" text-anchor="middle">NO SIGNAL</text><text class="ui" x="1310" y="680" fill="#5E6670" font-size="17" font-weight="700" text-anchor="middle">advantages collapse</text><rect x="360" y="775" width="880" height="92" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="380" y="802" fill="#B42318" font-size="14" font-weight="900" text-anchor="start">CAVEAT</text><text class="ui" x="380" y="829" fill="#171717" font-size="18" font-weight="640" text-anchor="start">Dynamic sampling restores variation but also changes which prompts</text><text class="ui" x="380" y="854" fill="#171717" font-size="18" font-weight="640" text-anchor="start">define the effective training distribution.</text></svg>
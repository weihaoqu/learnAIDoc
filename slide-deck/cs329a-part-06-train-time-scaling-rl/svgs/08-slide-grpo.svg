<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" stroke-width="1" opacity="0.38"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;letter-spacing:0}.mono{font-family:"SFMono-Regular","SF Mono",Consolas,monospace;letter-spacing:0}</style><rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.92"/><rect x="84" y="68" width="330" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="17" font-weight="900" text-anchor="start">RELATIVE GROUP FEEDBACK</text><rect x="1231" y="68" width="285" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1373.5" y="97" fill="#5E6670" font-size="15" font-weight="780" text-anchor="middle">PART 6  43:49-47:46</text><text class="ui" x="86" y="188" fill="#171717" font-size="52" font-weight="920" text-anchor="start">GRPO Uses Relative</text><text class="ui" x="86" y="247" fill="#171717" font-size="52" font-weight="920" text-anchor="start">Group Feedback</text><text class="ui" x="90" y="326" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">Sample a group, normalize rewards within it, and update the policy without a separately</text><text class="ui" x="90" y="355" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">learned critic.</text><rect x="80" y="470" width="260" height="112" rx="8" fill="#F3F7FF" stroke="#2563EB" stroke-width="2"/><text class="mono" x="210" y="512" fill="#2563EB" font-size="18" font-weight="900" text-anchor="middle">PROMPT</text><text class="ui" x="210" y="548" fill="#171717" font-size="17" font-weight="700" text-anchor="middle">sample a group</text><path d="M340 526 L460 526" fill="none" stroke="#2563EB" stroke-width="4"  marker-end="url(#arrow)"/><rect x="480" y="470" width="125" height="110" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="542" y="510" fill="#171717" font-size="17" font-weight="850" text-anchor="middle">o1</text><text class="mono" x="542" y="550" fill="#B42318" font-size="18" font-weight="850" text-anchor="middle">r=0.1</text><rect x="635" y="470" width="125" height="110" rx="8" fill="#F2FBF8" stroke="#16803C" stroke-width="2"/><text class="mono" x="697" y="510" fill="#171717" font-size="17" font-weight="850" text-anchor="middle">o2</text><text class="mono" x="697" y="550" fill="#16803C" font-size="18" font-weight="850" text-anchor="middle">r=1</text><rect x="790" y="470" width="125" height="110" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="852" y="510" fill="#171717" font-size="17" font-weight="850" text-anchor="middle">o3</text><text class="mono" x="852" y="550" fill="#B42318" font-size="18" font-weight="850" text-anchor="middle">r=0.4</text><rect x="945" y="470" width="125" height="110" rx="8" fill="#F2FBF8" stroke="#16803C" stroke-width="2"/><text class="mono" x="1007" y="510" fill="#171717" font-size="17" font-weight="850" text-anchor="middle">o4</text><text class="mono" x="1007" y="550" fill="#16803C" font-size="18" font-weight="850" text-anchor="middle">r=0.9</text><path d="M1070 526 L1170 526" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/><rect x="1170" y="435" width="350" height="260" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="1345" y="480" fill="#2F7373" font-size="18" font-weight="900" text-anchor="middle">GROUP BASELINE</text><text class="mono" x="1345" y="535" fill="#171717" font-size="22" font-weight="900" text-anchor="middle">A_i = r_i - mean(r)</text><g><rect x="1245" y="600" width="200" height="54" rx="8" fill="#FFFCF4" stroke="#722F37" stroke-width="2"/><text class="mono" x="1345" y="635" fill="#722F37" font-size="17" font-weight="850" text-anchor="middle">UPDATE POLICY</text></g><rect x="470" y="700" width="500" height="90" rx="8" fill="#FFFCF4" stroke="#B42318" stroke-width="2"/><text class="mono" x="720" y="738" fill="#B42318" font-size="18" font-weight="900" text-anchor="middle">NO SEPARATE LEARNED CRITIC</text><text class="ui" x="720" y="768" fill="#5E6670" font-size="17" font-weight="700" text-anchor="middle">relative group signal replaces that component</text></svg>
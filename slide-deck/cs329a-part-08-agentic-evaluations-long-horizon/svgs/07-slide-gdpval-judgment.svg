<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" stroke-width="1" opacity="0.38"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;letter-spacing:0}.mono{font-family:"SFMono-Regular","SF Mono",Consolas,monospace;letter-spacing:0}</style><rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.92"/><rect x="84" y="68" width="222" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="17" font-weight="900" text-anchor="start">ECONOMIC VALUE</text><rect x="1182.6" y="68" width="333.40000000000003" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1349.3" y="97" fill="#5E6670" font-size="15" font-weight="760" text-anchor="middle">PART 8  27:21-33:40 + GDPval v1</text><text class="ui" x="86" y="188" fill="#171717" font-size="50" font-weight="920" text-anchor="start">GDPval Changes the Question From</text><text class="ui" x="86" y="245" fill="#171717" font-size="50" font-weight="920" text-anchor="start">Duration to Deliverable Value</text><text class="ui" x="90" y="320" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">Experts compare realistic work products rather than only checking a final token or test.</text><rect x="90" y="455" width="300" height="185" rx="8" fill="#FFFCF4" stroke="#2563EB" stroke-width="2"/><text class="mono" x="240" y="512" fill="#2563EB" font-size="19" font-weight="900" text-anchor="middle">WORK BRIEF</text>
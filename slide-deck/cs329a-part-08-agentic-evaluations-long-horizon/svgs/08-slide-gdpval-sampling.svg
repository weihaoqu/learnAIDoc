<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" stroke-width="1" opacity="0.38"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;letter-spacing:0}.mono{font-family:"SFMono-Regular","SF Mono",Consolas,monospace;letter-spacing:0}</style><rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.92"/><rect x="84" y="68" width="222" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="17" font-weight="900" text-anchor="start">SAMPLING FRAME</text><rect x="1182.6" y="68" width="333.40000000000003" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1349.3" y="97" fill="#5E6670" font-size="15" font-weight="760" text-anchor="middle">PART 8  33:40-38:50 + GDPval v1</text><text class="ui" x="86" y="188" fill="#171717" font-size="50" font-weight="920" text-anchor="start">GDPval Samples Work,</text><text class="ui" x="86" y="245" fill="#171717" font-size="50" font-weight="920" text-anchor="start">Not Entire Occupations</text><text class="ui" x="90" y="320" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">Nine sectors and 44 occupations define a broad but bounded task distribution.</text><rect x="90" y="420" width="300" height="175" rx="8" fill="#FFFCF4" stroke="#2563EB" stroke-width="2"/><text class="mono" x="240" y="492" fill="#2563EB" font-size="44" font-weight="930" text-anchor="middle">9</text><text class="mono" x="240" y="545" fill="#171717" font-size="17" font-weight="850" text-anchor="middle">SECTORS</text><path d="M390 508 L400 553" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/><rect x="425" y="465" width="300" height="175" rx="8" fill="#FFFCF4" stroke="#8B7355" stroke-width="2"/><text class="mono" x="575" y="537" fill="#8B7355" font-size="44" font-weight="930" text-anchor="middle">44</text><text class="mono" x="575" y="590" fill="#171717" font-size="17" font-weight="850" text-anchor="middle">OCCUPATIONS</text><path d="M725 553 L755 598" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/><rect x="780" y="510" width="300" height="175" rx="8" fill="#FFFCF4" stroke="#2F7373" stroke-width="2"/><text class="mono" x="930" y="582" fill="#2F7373" font-size="44" font-weight="930" text-anchor="middle">1,320</text><text class="mono" x="930" y="635" fill="#171717" font-size="17" font-weight="850" text-anchor="middle">TASKS</text><path d="M1080 598 L1135 643" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/><rect x="1160" y="555" width="300" height="175" rx="8" fill="#FFFCF4" stroke="#722F37" stroke-width="2"/><text class="mono" x="1310" y="627" fill="#722F37" font-size="44" font-weight="930" text-anchor="middle">220</text><text class="mono" x="1310" y="680" fill="#171717" font-size="17" font-weight="850" text-anchor="middle">OPEN SET</text><rect x="1040" y="735" width="390" height="56" rx="8" fill="#FFF9E8" stroke="#8B7355" stroke-width="2"/><text class="mono" x="1235" y="770" fill="#8B7355" font-size="18" font-weight="850" text-anchor="middle">professionals avg. 14 years</text><rect x="200" y="760" width="750" height="90" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="218" y="787" fill="#B42318" font-size="14" font-weight="900" text-anchor="start">BOUNDARY</text><text class="ui" x="218" y="814" fill="#171717" font-size="18" font-weight="630" text-anchor="start">Broad sampling remains bounded sampling; tasks do not stand in</text><text class="ui" x="218" y="839" fill="#171717" font-size="18" font-weight="630" text-anchor="start">for every activity in an occupation.</text></svg>
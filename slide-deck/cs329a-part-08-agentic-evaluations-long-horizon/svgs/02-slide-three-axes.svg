"515" fill="#2563EB" font-size="22" font-weight="900" text-anchor="start">DURATION</text><text class="ui" x="138" y="574" fill="#171717" font-size="22" font-weight="750" text-anchor="start">success over human time</text><text class="ui" x="138" y="665" fill="#B42318" font-size="17" font-weight="700" text-anchor="start">time is only a proxy</text><rect x="585" y="410" width="430" height="300" rx="8" fill="#FFFCF4" stroke="#8B7355" stroke-width="2"/><text class="mono" x="623" y="462" fill="#8B7355" font-size="17" font-weight="900" text-anchor="start">02</text><text class="mono" x="623" y="515" fill="#8B7355" font-size="22" font-weight="900" text-anchor="start">ECONOMIC VALUE</text><text class="ui" x="623" y="574" fill="#171717" font-size="22" font-weight="750" text-anchor="start">expert preference</text><text class="ui" x="623" y="665" fill="#B42318" font-size="17" font-weight="700" text-anchor="start">sampled work, not whole jobs</text><rect x="1070" y="410" width="430" height="300" rx="8" fill="#FFFCF4" stroke="#2F7373" stroke-width="2"/><text class="mono" x="1108" y="462" fill="#2F7373" font-size="17" font-weight="900" text-anchor="start">03</text><text class="mono" x="1108" y="515" fill="#2F7373" font-size="22" font-weight="900" text-anchor="start">EVIDENCE QUALITY</text><text class="ui" x="1108" y="574" fill="#171717" font-size="22" font-weight="750" text-anchor="start">grounded synthesis</text><text class="ui" x="1108" y="665" fill="#B42318" font-size="17" font-weight="700" text-anchor="start">coverage can remain hidden</text><rect x="355" y="760" width="890" height="65" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="373" y="787" fill="#B42318" font-size="14" font-weight="900" text-anchor="start">BOUNDARY</text><text class="ui" x="373" y="814" fill="#171717" font-size="18" font-weight="630" text-anchor="start">Improvement on one axis does not imply improvement on the other two.</text></svg>
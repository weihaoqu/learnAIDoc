<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" stroke-width="1" opacity="0.38"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;letter-spacing:0}.mono{font-family:"SFMono-Regular","SF Mono",Consolas,monospace;letter-spacing:0}</style><rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.92"/><rect x="84" y="68" width="258" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="17" font-weight="900" text-anchor="start">EXTERNAL VALIDITY</text><rect x="1186" y="68" width="330" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1351" y="97" fill="#5E6670" font-size="15" font-weight="760" text-anchor="middle">PART 8  16:55-22:10 + METR v4</text><text class="ui" x="86" y="188" fill="#171717" font-size="50" font-weight="920" text-anchor="start">The Seven-Month Trend Is Historical,</text><text class="ui" x="86" y="245" fill="#171717" font-size="50" font-weight="920" text-anchor="start">Not a Deployment Forecast</text><text class="ui" x="90" y="320" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">Observed benchmark scaling does not remove task-distribution or future-trend uncertainty.</text><rect x="90" y="400" width="1040" height="350" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><path d="M150 710 L1080 420" fill="none" stroke="#2563EB" stroke-width="6"/><circle cx="180" cy="690" r="11" fill="#2563EB"/><circle cx="320" cy="660" r="11" fill="#2563EB"/><circle cx="455" cy="625" r="11" fill="#2563EB"/><circle cx="590" cy="590" r="11" fill="#2563EB"/><circle cx="730" cy="555" r="11" fill="#2563EB"/><circle cx="870" cy="510" r="11" fill="#2563EB"/><circle cx="1010" cy="465" r="11" fill="#2563EB"/><text class="mono" x="590" y="690" fill="#2563EB" font-size="18" font-weight="850" text-anchor="middle">historical fit  |  approximately 7-month doubling</text><rect x="1160" y="400" width="350" height="350" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="1335" y="480" fill="#B42318" font-size="19" font-weight="900" text-anchor="middle">UNCERTAINTY</text><text class="ui" x="1335" y="535" fill="#171717" font-size="20" font-weight="750" text-anchor="middle">future systems</text><text class="ui" x="1335" y="575" fill="#171717" font-size="20" font-weight="750" text-anchor="middle">task distribution</text><text class="ui" x="1335" y="615" fill="#171717" font-size="20" font-weight="750" text-anchor="middle">deployment context</text><text class="mono" x="1335" y="690" fill="#B42318" font-size="18" font-weight="900" text-anchor="middle">NO FORECAST</text><rect x="360" y="785" width="880" height="90" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="378" y="812" fill="#B42318" font-size="14" font-weight="900" text-anchor="start">BOUNDARY</text><text class="ui" x="378" y="839" fill="#171717" font-size="18" font-weight="630" text-anchor="start">A historical benchmark trend is evidence about the studied period, not a</text><text class="ui" x="378" y="864" fill="#171717" font-size="18" font-weight="630" text-anchor="start">deployment guarantee.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E7E8E1" stroke-width="1"/></pattern></defs><rect width="1600" height="900" fill="#EEEAE1"/><rect x="28" y="28" width="1544" height="844" rx="8" fill="#FFFEF8" stroke="#CFD3CE" stroke-width="2"/><rect x="28" y="28" width="1544" height="844" rx="8" fill="url(#grid)" opacity="0.64"/><rect x="72" y="58" width="275" height="48" rx="8" fill="#ECFAF7" stroke="#087E73" stroke-width="2"/><text x="209.5" y="89" fill="#087E73" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">FEEDBACK DESIGN</text><rect x="365" y="58" width="230" height="48" rx="8" fill="#ECFAF7" stroke="#087E73" stroke-width="2"/><text x="480" y="89" fill="#087E73" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">TEACHING SYNTHESIS</text><rect x="1380" y="58" width="148" height="48" rx="8" fill="#FFF6DD" stroke="#A86500" stroke-width="2"/><text x="1454" y="89" fill="#A86500" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">3 MIN</text><text x="76" y="182" fill="#172027" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" text-anchor="start" letter-spacing="0">Climb the</text><text x="76" y="242" fill="#172027" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" text-anchor="start" letter-spacing="0">Verifier Ladder</text><text x="78" y="316" fill="#52606B" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" text-anchor="start" letter-spacing="0">Independence can reduce correlated error; authority remains separate.</text><rect x="170" y="705" width="280" height="58" rx="8" fill="#FFF0EE" stroke="#B3342D" stroke-width="2"/><text x="192" y="742" fill="#B3342D" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" text-anchor="start" letter-spacing="0">1  SAME-MODEL CRITIQUE</text><rect x="340" y="635" width="340" height="58" rx="8" fill="#FFF6DD" stroke="#A86500" stroke-width="2"/><text x="362" y="672" fill="#A86500" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" text-anchor="start" letter-spacing="0">2  EXPLICIT RUBRIC</text><rect x="510" y="565" width="400" height="58" rx="8" fill="#F5F1FF" stroke="#6853A6" stroke-width="2"/><text x="532" y="602" fill="#6853A6" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" text-anchor="start" letter-spacing="0">3  SEPARATE REVIEWER</text><rect x="680" y="495" width="460" height="58" rx="8" fill="#ECFAF7" stroke="#087E73" stroke-width="2"/><text x="702" y="532" fill="#087E73" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" text-anchor="start" letter-spacing="0">4  TOOLS / TESTS / SOURCES</text><rect x="850" y="425" width="520" height="58" rx="8" fill="#EFF9F1" stroke="#287A45" stroke-width="2"/><text x="872" y="462" fill="#287A45" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="850" text-anchor="start" letter-spacing="0">5  QUALIFIED HUMAN AUTHORITY</text><text x="1420" y="455" fill="#287A45" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="750" text-anchor="middle" letter-spacing="0">stronger</text><text x="1420" y="478" fill="#287A45" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="750" text-anchor="middle" letter-spacing="0">evidence</text><path d="M 1420 610 L 1420 490" fill="none" stroke="#287A45" stroke-width="4"/><path d="M 1420 490 L 1426 500.39230484541326 L 1414 500.39230484541326 Z" fill="#287A45"/><text x="230" y="650" fill="#B3342D" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="750" text-anchor="middle" letter-spacing="0">cheap</text><text x="230" y="673" fill="#B3342D" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="750" text-anchor="middle" letter-spacing="0">shared</text><text x="230" y="696" fill="#B3342D" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="750" text-anchor="middle" letter-spacing="0">blind spots</text><text x="800" y="790" fill="#172027" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" text-anchor="middle" letter-spacing="0">Independence may reduce correlated error. It does not create ground truth.</text><line x1="72" y1="826" x2="1528" y2="826" stroke="#CFD3CE" stroke-width="2"/><text x="76" y="855" fill="#52606B" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0">SOURCE MAP  Synthesis of Self-Refine, Reflexion, CRITIC, and classroom review</text><text x="1524" y="855" fill="#52606B" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="850" text-anchor="end" letter-spacing="0">07 / 13</text></svg>
"2"/><rect x="100" y="430" width="80" height="48" rx="8" fill="#FFFEF8" stroke="#145DA0" stroke-width="2"/><text x="140" y="461" fill="#145DA0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">01</text><text x="205" y="460" fill="#145DA0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="900" text-anchor="start" letter-spacing="0">SPECIFICATION</text><text x="205" y="504" fill="#172027" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="650" text-anchor="start" letter-spacing="0">Can success be stated?</text><rect x="845" y="405" width="680" height="145" rx="8" fill="#ECFAF7" stroke="#087E73" stroke-width="2"/><rect x="870" y="430" width="80" height="48" rx="8" fill="#FFFEF8" stroke="#087E73" stroke-width="2"/><text x="910" y="461" fill="#087E73" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">02</text><text x="975" y="460" fill="#087E73" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="900" text-anchor="start" letter-spacing="0">VERIFICATION</text><text x="975" y="504" fill="#172027" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="650" text-anchor="start" letter-spacing="0">Can quality be checked?</text><rect x="75" y="600" width="680" height="145" rx="8" fill="#FFF6DD" stroke="#A86500" stroke-width="2"/><rect x="100" y="625" width="80" height="48" rx="8" fill="#FFFEF8" stroke="#A86500" stroke-width="2"/><text x="140" y="656" fill="#A86500" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">03</text><text x="205" y="655" fill="#A86500" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="900" text-anchor="start" letter-spacing="0">REPAIRABILITY</text><text x="205" y="699" fill="#172027" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="650" text-anchor="start" letter-spacing="0">Can defects be repaired safely?</text><rect x="845" y="600" width="680" height="145" rx="8" fill="#FFF0EE" stroke="#B3342D" stroke-width="2"/><rect x="870" y="625" width="80" height="48" rx="8" fill="#FFFEF8" stroke="#B3342D" stroke-width="2"/><text x="910" y="656" fill="#B3342D" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">04</text><text x="975" y="655" fill="#B3342D" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="900" text-anchor="start" letter-spacing="0">BOUNDEDNESS</text><text x="975" y="699" fill="#172027" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="650" text-anchor="start" letter-spacing="0">Can cost, data, and authority be limited?</text><rect x="600" y="770" width="400" height="48" rx="8" fill="#EFF9F1" stroke="#287A45" stroke-width="2"/><text x="800" y="801" fill="#287A45" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">FOUR YES ANSWERS -&gt; BOUNDED LOOP</text><line x1="72" y1="826" x2="1528" y2="826" stroke="#CFD3CE" stroke-width="2"/><text x="76" y="855" fill="#52606B" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0">SOURCE MAP  Independent teaching framework</text><text x="1524" y="855" fill="#52606B" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="850" text-anchor="end" letter-spacing="0">05 / 13</text></svg>
h="2"/><text x="470" y="681" fill="#287A45" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">FINAL / HANDOFF</text><rect x="610" y="650" width="240" height="48" rx="8" fill="#FFF0EE" stroke="#B3342D" stroke-width="2"/><text x="730" y="681" fill="#B3342D" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">TIME + CALL COUNT</text><rect x="880" y="650" width="240" height="48" rx="8" fill="#F5F1FF" stroke="#6853A6" stroke-width="2"/><text x="1000" y="681" fill="#6853A6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">UNCERTAINTY</text><rect x="1150" y="650" width="225" height="48" rx="8" fill="#FFFEF8" stroke="#6853A6" stroke-width="2"/><text x="1262.5" y="681" fill="#6853A6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">REFLECTION</text><text x="800" y="785" fill="#B3342D" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="850" text-anchor="middle" letter-spacing="0">The polished artifact is evidence, but it is not the whole grade.</text><line x1="72" y1="826" x2="1528" y2="826" stroke="#CFD3CE" stroke-width="2"/><text x="76" y="855" fill="#52606B" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0">SOURCE MAP  Assessment design for this lesson</text><text x="1524" y="855" fill="#52606B" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="850" text-anchor="end" letter-spacing="0">12 / 13</text></svg>
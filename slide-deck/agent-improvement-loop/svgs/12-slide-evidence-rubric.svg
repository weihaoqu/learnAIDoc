<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E7E8E1" stroke-width="1"/></pattern></defs><rect width="1600" height="900" fill="#EEEAE1"/><rect x="28" y="28" width="1544" height="844" rx="8" fill="#FFFEF8" stroke="#CFD3CE" stroke-width="2"/><rect x="28" y="28" width="1544" height="844" rx="8" fill="url(#grid)" opacity="0.64"/><rect x="72" y="58" width="275" height="48" rx="8" fill="#ECFAF7" stroke="#087E73" stroke-width="2"/><text x="209.5" y="89" fill="#087E73" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">7-MINUTE ASSESSMENT</text><rect x="365" y="58" width="190" height="48" rx="8" fill="#F5F1FF" stroke="#6853A6" stroke-width="2"/><text x="460" y="89" fill="#6853A6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">CLASSROOM LAB</text><rect x="1380" y="58" width="148" height="48" rx="8" fill="#FFF6DD" stroke="#A86500" stroke-width="2"/><text x="1454" y="89" fill="#A86500" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">7 MIN</text><text x="76" y="182" fill="#172027" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" text-anchor="start" letter-spacing="0">Submit Evidence,</text><text x="76" y="242" fill="#172027" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" text-anchor="start" letter-spacing="0">Not Just Polish</text><text x="78" y="316" fill="#52606B" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" text-anchor="start" letter-spacing="0">Grade the contract, verifier, revisions, stopping, evidence, and reflection.</text><rect x="90" y="430" width="272" height="82" rx="4" fill="#EDF6FF" stroke="#145DA0" stroke-width="2
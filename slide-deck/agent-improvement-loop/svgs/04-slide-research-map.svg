<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E7E8E1" stroke-width="1"/></pattern></defs><rect width="1600" height="900" fill="#EEEAE1"/><rect x="28" y="28" width="1544" height="844" rx="8" fill="#FFFEF8" stroke="#CFD3CE" stroke-width="2"/><rect x="28" y="28" width="1544" height="844" rx="8" fill="url(#grid)" opacity="0.64"/><rect x="72" y="58" width="275" height="48" rx="8" fill="#ECFAF7" stroke="#087E73" stroke-width="2"/><text x="209.5" y="89" fill="#087E73" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">RESEARCH MAP</text><rect x="365" y="58" width="230" height="48" rx="8" fill="#EDF6FF" stroke="#145DA0" stroke-width="2"/><text x="480" y="89" fill="#145DA0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">REPORTED EVIDENCE</text><rect x="1380" y="58" width="148" height="48" rx="8" fill="#FFF6DD" stroke="#A86500" stroke-width="2"/><text x="1454" y="89" fill="#A86500" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">3 MIN</text><text x="76" y="182" fill="#172027" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" text-anchor="start" letter-spacing="0">Four Research Patterns</text><text x="76" y="242" fill="#172027" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" text-anchor="start" letter-spacing="0">Define the Opportunity and Limit</text><text x="78" y="316" fill="#52606B" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="650" text-anchor="start" letter-spacing="0">Refinement improves some tasks; external feedback changes reliability.</text><rect x="75" y="405" width="700" height="155" rx="8" fill="#EDF6FF" stroke="#145DA0" stroke-width="2"/><text x="103" y="445" fill="#145DA0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="900" text-anchor="start" letter-spacing="0">SELF-REFINE</text><text x="103" y="483" fill="#172027" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0">Feedback: same model</text><text x="103" y="521" fill="#52606B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="650" text-anchor="start" letter-spacing="0">Can improve some generation tasks; errors persist.</text><rect x="825" y="405" width="700" height="155" rx="8" fill="#F5F1FF" stroke="#6853A6" stroke-width="2"/><text x="853" y="445" fill="#6853A6" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="900" text-anchor="start" letter-spacing="0">REFLEXION</text><text x="853" y="483" fill="#172027" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0">Feedback: task result + memory</text><text x="853" y="521" fill="#52606B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="650" text-anchor="start" letter-spacing="0">Carries textual lessons into later trials.</text><rect x="75" y="600" width="700" height="155" rx="8" fill="#ECFAF7" stroke="#087E73" stroke-width="2"/><text x="103" y="640" fill="#087E73" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="900" text-anchor="start" letter-spacing="0">CRITIC</text><text x="103" y="678" fill="#172027" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0">Feedback: external tools</text><text x="103" y="716" fill="#52606B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="650" text-anchor="start" letter-spacing="0">Grounds revision in observable tool feedback.</text><rect x="825" y="600" width="700" height="155" rx="8" fill="#FFF0EE" stroke="#B3342D" stroke-width="2"/><text x="853" y="640" fill="#B3342D" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="900" text-anchor="start" letter-spacing="0">INTRINSIC CORRECTION LIMIT</text><text x="853" y="678" fill="#172027" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0">Feedback: none external</text><text x="853" y="716" fill="#52606B" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="650" text-anchor="start" letter-spacing="0">Can fail or degrade studied reasoning.</text><line x1="72" y1="826" x2="1528" y2="826" stroke="#CFD3CE" stroke-width="2"/><text x="76" y="855" fill="#52606B" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0">SOURCE MAP  Madaan et al.; Shinn et al.; Gou et al.; Huang et al.</text><text x="1524" y="855" fill="#52606B" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="850" text-anchor="end" letter-spacing="0">04 / 13</text></svg>
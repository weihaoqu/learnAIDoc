text x="400" y="650" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="0">Capability may be strong</text><text x="400" y="677" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="0">but nothing necessarily changes</text><rect x="780" y="400" width="730" height="350" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text x="1145" y="458" fill="#2F7373" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="0">IMPROVING AGENT SYSTEM</text><rect x="850" y="525" width="170" height="48" rx="8" fill="#F3F7FF" stroke="#2563EB" stroke-width="2"/><text x="935" y="556" fill="#2563EB" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">STATE</text><rect x="1080" y="525" width="170" height="48" rx="8" fill="#FFF5F3" stroke="#722F37" stroke-width="2"/><text x="1165" y="556" fill="#722F37" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">TOOLS</text><rect x="1310" y="525" width="150" height="48" rx="8" fill="#FFF9E8" stroke="#8B7355" stroke-width="2"/><text x="1385" y="556" fill="#8B7355" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">ACTION</text><rect x="955" y="625" width="190" height="48" rx="8" fill="#FFFCF4" stroke="#2F7373" stroke-width="2"/><text x="1050" y="656" fill="#2F7373" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">FEEDBACK</text><rect x="1190" y="625" width="190" height="48" rx="8" fill="#F2FBF5" stroke="#16803C" stroke-width="2"/><text x="1285" y="656" fill="#16803C" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">
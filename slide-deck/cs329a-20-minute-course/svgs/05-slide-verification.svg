n 0</text><text x="120" y="587" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" letter-spacing="0">return 100 / x</text><path d="M 380 570 L 485 570" fill="none" stroke="#2563EB" stroke-width="4"/><path d="M 485 570 L 474.60769515458674 576 L 474.60769515458674 564 Z" fill="#2563EB"/><rect x="485" y="405" width="300" height="340" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text x="635" y="460" fill="#2F7373" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="900" text-anchor="middle" letter-spacing="0">TEST SUITE</text><rect x="535" y="520" width="200" height="48" rx="8" fill="#FFFCF4" stroke="#2F7373" stroke-width="2"/><text x="635" y="551" fill="#2F7373" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">PUBLIC TESTS</text><rect x="535" y="595" width="200" height="48" rx="8" fill="#FFF9E8" stroke="#8B7355" stroke-width="2"/><text x="635" y="626" fill="#8B7355" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">HIDDEN CASES</text><text x="635" y="690" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="0">A specification</text><text x="635" y="712" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="0">with blind spots</text><path d="M 785 570 L 890 570" fill="none" stroke="#2F7373" stroke-width="4"/><path d="M 890 570 L 879.6076951545867 576 L 879.6076951545867 564 Z" fill="#2F7373"/><rect x="890" y="405" width="640" height="340" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><rect x="930" y="475" width="250" height="48" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text x="1055" y="506" fill="#B42318" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">FALSE ACCEPT</text><text x="1200" y="505" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" letter-spacing="0">wrong behavior passes</text><rect x="930" y="555" width="250" height="48" rx="8" fill="#FFF9E8" stroke="#8B7355" stroke-width="2"/><text x="1055" y="586" fill="#8B7355" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">FALSE REJECT</text><text x="1200" y="585" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" letter-spacing="0">valid alternative fails</text><rect x="930" y="635" width="250" height="48" rx="8" fill="#FFF5F3" stroke="#722F37" stroke-width="2"/><text x="1055" y="666" fill="#722F37" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="850" text-anchor="middle" letter-spacing="0">GAMING</text><text x="1200" y="665" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" letter-spacing="0">optimize the check</text><text x="1210" y="775" fill="#B42318" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="0">Ask what the verifier cannot see.</text><line x1="72" y1="826" x2="1528" y2="826" stroke="#D8D0C0" stroke-width="2"/><text x="76" y="856" fill="#5E6670" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0">SOURCE MAP  CS329A PARTS 3-4: ROBUST VERIFICATION; FEEDBACK WITH TOOLS AND CODE</text><text x="1524" y="856" fill="#5E6670" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" text-anchor="end" letter-spacing="0">05 / 10</text>

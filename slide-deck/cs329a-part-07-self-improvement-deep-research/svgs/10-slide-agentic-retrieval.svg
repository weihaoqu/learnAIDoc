ill="#171717" font-size="16" font-weight="680" text-anchor="middle">state update</text><rect x="480" y="340" width="240" height="130" rx="8" fill="#FFFCF4" stroke="#B42318" stroke-width="2"/><text class="mono" x="600" y="395" fill="#B42318" font-size="19" font-weight="900" text-anchor="middle">DETECT GAP</text><text class="ui" x="600" y="435" fill="#171717" font-size="16" font-weight="680" text-anchor="middle">uncertainty</text><rect x="850" y="340" width="240" height="130" rx="8" fill="#FFFCF4" stroke="#2F7373" stroke-width="2"/><text class="mono" x="970" y="395" fill="#2F7373" font-size="19" font-weight="900" text-anchor="middle">SEARCH</text><text class="ui" x="970" y="435" fill="#171717" font-size="16" font-weight="680" text-anchor="middle">controlled action</text><rect x="1130" y="455" width="240" height="130" rx="8" fill="#FFFCF4" stroke="#16803C" stroke-width="2"/><text class="mono" x="1250" y="510" fill="#16803C" font-size="19" font-weight="900" text-anchor="middle">RESUME</text><text class="ui" x="1250" y="550" fill="#171717" font-size="16" font-weight="680" text-anchor="middle">state update</text><path d="M380 520 L480 445" fill="none" stroke="#2563EB" stroke-width="4"  marker-end="url(#arrow)"/><path d="M720 405 L850 405" fill="none" stroke="#B42318" stroke-width="4"  marker-end="url(#arrow)"/><path d="M1090 445 L1130 500" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/><path d="M1250 585 C1120 745 470 745 260 585" fill="none" stroke="#16803C" stroke-width="4" marker-end="url(#arrow)"/><rect x="390" y="760" width="820" height="90" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="408" y="787" fill="#B42318" font-size="14" font-weight="900" text-anchor="start">BOUNDARY</text><text class="ui" x="408" y="814" fill="#171717" font-size="18" font-weight="630" text-anchor="start">Agentic retrieval controls when to search; it does not certify the</text><text class="ui" x="408" y="839" fill="#171717" font-size=
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" stroke-width="1" opacity="0.38"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;letter-spacing:0}.mono{font-family:"SFMono-Regular","SF Mono",Consolas,monospace;letter-spacing:0}</style><rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.92"/><rect x="84" y="68" width="258" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="17" font-weight="900" text-anchor="start">REASONING FAILURE</text><rect x="1182.6" y="68" width="333.40000000000003" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1349.3" y="97" fill="#5E6670" font-size="15" font-weight="760" text-anchor="middle">PART 7  46:33-50:40 + Search-o1</text><text class="ui" x="86" y="188" fill="#171717" font-size="50" font-weight="920" text-anchor="start">One Missing Fact Can Corrupt</text><text class="ui" x="86" y="245" fill="#171717" font-size="50" font-weight="920" text-anchor="start">the Rest of a Reasoning Chain</text><text class="ui" x="90" y="320" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">Fluent continuation can hide the point where uncertainty became a guess.</text><rect x="100" y="470" width="230" height="150" rx="8" fill="#FFFCF4" stroke="#2F7373" stroke-width="2"/><text class="mono" x="215" y="525" fill="#2F7373" font-size="20" font-weight="900" text-anchor="middle">known fact</text><path d="M330 545 L375 545" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/><rect x="390" y="470" width="230" height="150" rx="8" fill="#FFFCF4" stroke="#2F7373" stroke-width="2"/><text class="mono" x="505" y="525" fill="#2F7373" font-size="20" font-weight="900" text-anchor="middle">reasoning</text><path d="M620 545 L665 545" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/><rect x="680" y="470" width="230" height="150" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="795" y="525" fill="#B42318" font-size="20" font-weight="900" text-anchor="middle">KNOWLEDGE GAP</text><path d="M910 545 L955 545" fill="none" stroke="#B42318" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrow)"/><rect x="970" y="470" width="230" height="150" rx="8" fill="#FFFCF4" stroke="#722F37" stroke-width="2"/><text class="mono" x="1085" y="525" fill="#722F37" font-size="20" font-weight="900" text-anchor="middle">unsupported guess</text><path d="M1200 545 L1245 545" fill="none" stroke="#2F7373" stroke-width="4"  marker-end="url(#arrow)"/><rect x="1260" y="470" width="230" height="150" rx="8" fill="#FFFCF4" stroke="#B42318" stroke-width="2"/><text class="mono" x="1375" y="525" fill="#B42318" font-size="20" font-weight="900" text-anchor="middle">wrong answer</text><text class="ui" x="800" y="700" fill="#B42318" font-size="28" font-weight="850" text-anchor="middle">Fluency continues after evidence stops.</text><rect x="380" y="765" width="840" height="90" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="398" y="792" fill="#B42318" font-size="14" font-weight="900" text-anchor="start">BOUNDARY</text><text class="ui" x="398" y="819" fill="#171717" font-size="18" font-weight="630" text-anchor="start">The failure begins at the unsupported transition, not only at the</text><text class="ui" x="398" y="844" fill="#171717" font-size="18" font-weight="630" text-anchor="start">final answer.</text></svg>
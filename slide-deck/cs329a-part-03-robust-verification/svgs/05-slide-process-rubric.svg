y="510" fill="#171717" font-size="24" font-weight="750" text-anchor="middle">valid shortcut?</text><path d="M800 550 L310 625" fill="none" stroke="#16803C" stroke-width="3"  marker-end="url(#arrow)"/><rect x="120" y="625" width="380" height="145" rx="8" fill="#FFFCF4" stroke="#16803C" stroke-width="2"/><text class="mono" x="310" y="675" fill="#16803C" font-size="20" font-weight="900" text-anchor="middle">CORRECT?</text><text class="ui" x="310" y="720" fill="#171717" font-size="21" font-weight="680" text-anchor="middle">factual / logical</text><path d="M800 550 L800 625" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><rect x="610" y="625" width="380" height="145" rx="8" fill="#FFFCF4" stroke="#2563EB" stroke-width="2"/><text class="mono" x="800" y="675" fill="#2563EB" font-size="20" font-weight="900" text-anchor="middle">RELEVANT?</text><text class="ui" x="800" y="720" fill="#171717" font-size="21" font-weight="680" text-anchor="middle">advances the solution</text><path d="M800 550 L1290 625" fill="none" stroke="#722F37" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1100" y="625" width="380" height="145" rx="8" fill="#FFFCF4" stroke="#722F37" stroke-width="2"/><text class="mono" x="1290" y="675" fill="#722F37" font-size="20" font-weight="900" text-anchor="middle">SUFFICIENT?</text><text class="ui" x="1290" y="720" fill="#171717" font-size="21" font-weight="680" text-anchor="middle">justified enough</text><rect x="410" y="805" width="780" height="96" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="430" y="833" fill="#B42318" font-size="15" font-weight="900" text-anchor="start">CAVEAT</text><text class="ui" x="430" y="862" fill="#171717" font-size="20" font-weight="640" text-anchor="start">A process label encodes an annotation policy and may reject</text><text class="ui" x="430" y="889" fill="#171717" font-size="20" font-weight="640" text-anchor="start">valid alternative reasoning styles.</text></svg>
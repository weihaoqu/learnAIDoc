<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" stroke-width="1" opacity="0.38"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;letter-spacing:0}.mono{font-family:"SFMono-Regular","SF Mono",Consolas,monospace;letter-spacing:0}</style><rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.9"/><rect x="84" y="68" width="270" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="16" font-weight="900" text-anchor="start">ENSEMBLE ASSUMPTIONS</text><rect x="1096" y="68" width="420" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1306" y="97" fill="#5E6670" font-size="15" font-weight="780" text-anchor="middle">PART 3  57:36-60:07 + arXiv:2506.18203</text><text class="ui" x="86" y="188" fill="#171717" font-size="51" font-weight="920" text-anchor="start">Shared Blind Spots Can Defeat</text><text class="ui" x="86" y="246" fill="#171717" font-size="51" font-weight="920" text-anchor="start">an Entire Verifier Ensemble</text><text class="ui" x="90" y="324" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">Complementary errors add evidence; correlated errors repeat the same mistake.</text><rect x="80" y="410" width="650" height="335" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="405" y="465" fill="#2F7373" font-size="21" font-weight="900" text-anchor="middle">COMPLEMENTARY ERRORS</text><circle cx="220" cy="545" r="42" fill="#2563EB"/><path d="M202 545 l12 12 l26 -28" fill="none" stroke="#fff" stroke-width="6"/><circle cx="360" cy="500" r="42" fill="#2F7373"/><path d="M342 500 l12 12 l26 -28" fill="none" stroke="#fff" stroke-width="6"/><circle cx="500" cy="595" r="42" fill="#8B7355"/><path d="M482 595 l12 12 l26 -28" fill="none" stroke="#fff" stroke-width="6"/><text class="ui" x="405" y="705" fill="#5E6670" font-size="19" font-weight="700" text-anchor="middle">different evidence adds value</text><rect x="870" y="410" width="650" height="335" rx="8" fill="#FFF5F3" stroke="#722F37" stroke-width="2"/><text class="mono" x="1195" y="465" fill="#722F37" font-size="21" font-weight="900" text-anchor="middle">CORRELATED BLIND SPOT</text><circle cx="1000" cy="505" r="42" fill="#722F37"/><path d="M983 488 l34 34 M1017 488 l-34 34" stroke="#fff" stroke-width="6"/><circle cx="1160" cy="555" r="42" fill="#722F37"/><path d="M1143 538 l34 34 M1177 538 l-34 34" stroke="#fff" stroke-width="6"/><circle cx="1320" cy="605" r="42" fill="#722F37"/><path d="M1303 588 l34 34 M1337 588 l-34 34" stroke="#fff" stroke-width="6"/><text class="ui" x="1195" y="705" fill="#5E6670" font-size="19" font-weight="700" text-anchor="middle">same mistake repeated</text><rect x="455" y="790" width="690" height="96" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="475" y="818" fill="#B42318" font-size="15" font-weight="900" text-anchor="start">CAVEAT</text><text class="ui" x="475" y="847" fill="#171717" font-size="20" font-weight="640" text-anchor="start">Weighting cannot create independent evidence when</text><text class="ui" x="475" y="874" fill="#171717" font-size="20" font-weight="640" text-anchor="start">every verifier shares the same failure.</text></svg>
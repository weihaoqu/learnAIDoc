<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" stroke-width="1" opacity="0.38"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;letter-spacing:0}.mono{font-family:"SFMono-Regular","SF Mono",Consolas,monospace;letter-spacing:0}</style><rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.9"/><rect x="84" y="68" width="220" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="16" font-weight="900" text-anchor="start">LABEL NOISE</text><rect x="1246" y="68" width="270" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1381" y="97" fill="#5E6670" font-size="15" font-weight="780" text-anchor="middle">PART 3  40:42-43:27</text><text class="ui" x="86" y="188" fill="#171717" font-size="51" font-weight="920" text-anchor="start">Rollout Labels Inherit</text><text class="ui" x="86" y="246" fill="#171717" font-size="51" font-weight="920" text-anchor="start">the Search Policy's Blind Spots</text><text class="ui" x="90" y="324" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">Good rare paths can look bad; wrong steps can look good after a lucky repair.</text><rect x="80" y="410" width="680" height="340" rx="8" fill="#F3F7FF" stroke="#2563EB" stroke-width="2"/><text class="mono" x="420" y="465" fill="#2563EB" font-size="21" font-weight="900" text-anchor="middle">RARE VALID PATH MISSED</text><rect x="135" y="565" width="180" height="56" rx="8" fill="#FFFCF4" stroke="#16803C" stroke-width="2"/><text class="mono" x="225" y="601" fill="#16803C" font-size="19" font-weight="850" text-anchor="middle">good prefix</text><path d="M315 593 L450 520" fill="none" stroke="#16803C" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><path d="M315 593 L450 665" fill="none" stroke="#B42318" stroke-width="3"  marker-end="url(#arrow)"/><rect x="450" y="492" width="210" height="56" rx="8" fill="#FFFCF4" stroke="#16803C" stroke-width="2"/><text class="mono" x="555" y="528" fill="#16803C" font-size="19" font-weight="850" text-anchor="middle">rare success</text><rect x="450" y="637" width="210" height="56" rx="8" fill="#FFFCF4" stroke="#B42318" stroke-width="2"/><text class="mono" x="555" y="673" fill="#B42318" font-size="19" font-weight="850" text-anchor="middle">sampled fails</text><text class="ui" x="420" y="720" fill="#B42318" font-size="19" font-weight="800" text-anchor="middle">false negative label</text><rect x="840" y="410" width="680" height="340" rx="8" fill="#FFF5F3" stroke="#722F37" stroke-width="2"/><text class="mono" x="1180" y="465" fill="#722F37" font-size="21" font-weight="900" text-anchor="middle">WRONG STEP LUCKILY REPAIRED</text><rect x="895" y="565" width="180" height="56" rx="8" fill="#FFFCF4" stroke="#B42318" stroke-width="2"/><text class="mono" x="985" y="601" fill="#B42318" font-size="19" font-weight="850" text-anchor="middle">bad prefix</text><path d="M1075 593 L1210 593" fill="none" stroke="#2F7373" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1210" y="565" width="220" height="56" rx="8" fill="#FFFCF4" stroke="#2F7373" stroke-width="2"/><text class="mono" x="1320" y="601" fill="#2F7373" font-size="19" font-weight="850" text-anchor="middle">lucky correction</text><text class="ui" x="1180" y="720" fill="#B42318" font-size="19" font-weight="800" text-anchor="middle">false positive label</text><rect x="470" y="800" width="660" height="96" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="490" y="828" fill="#B42318" font-size="15" font-weight="900" text-anchor="start">CAVEAT</text><text class="ui" x="490" y="857" fill="#171717" font-size="20" font-weight="640" text-anchor="start">Rollout labels mix prefix quality with the</text><text class="ui" x="490" y="884" fill="#171717" font-size="20" font-weight="640" text-anchor="start">capability and luck of the rollout policy.</text></svg>
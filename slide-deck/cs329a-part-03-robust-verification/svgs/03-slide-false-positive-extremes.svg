<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" stroke-width="1" opacity="0.38"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;letter-spacing:0}.mono{font-family:"SFMono-Regular","SF Mono",Consolas,monospace;letter-spacing:0}</style><rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.9"/><rect x="84" y="68" width="248" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="16" font-weight="900" text-anchor="start">SELECTION REVERSAL</text><rect x="1246" y="68" width="270" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1381" y="97" fill="#5E6670" font-size="15" font-weight="780" text-anchor="middle">PART 3  14:19-18:24</text><text class="ui" x="86" y="188" fill="#171717" font-size="51" font-weight="920" text-anchor="start">More Candidates Create More</text><text class="ui" x="86" y="246" fill="#171717" font-size="51" font-weight="920" text-anchor="start">False-Positive Opportunities</text><text class="ui" x="90" y="324" fill="#5E6670" font-size="23" font-weight="560" text-anchor="start">The maximum noisy score becomes less trustworthy unless verifier precision scales too.</text><rect x="90" y="420" width="570" height="300" rx="8" fill="#F3F7FF" stroke="#2563EB" stroke-width="2"/><text class="mono" x="135" y="475" fill="#2563EB" font-size="20" font-weight="900" text-anchor="start">AS N GROWS</text><text class="ui" x="135" y="535" fill="#171717" font-size="26" font-weight="800" text-anchor="start">chance of a correct candidate</text><text class="ui" x="135" y="568" fill="#171717" font-size="26" font-weight="800" text-anchor="start">rises</text><text class="ui" x="135" y="630" fill="#722F37" font-size="24" font-weight="800" text-anchor="start">chance of an extreme verifier</text><text class="ui" x="135" y="661" fill="#722F37" font-size="24" font-weight="800" text-anchor="start">false positive rises too</text><rect x="750" y="400" width="765" height="340" rx="8" fill="#FFFCF4" stroke="#722F37" stroke-width="2"/><text class="mono" x="790" y="445" fill="#722F37" font-size="19" font-weight="900" text-anchor="start">NOISY SCORE COMPETITION</text><circle cx="825" cy="450" r="23" fill="#D8D0C0" opacity="0.74"/><circle cx="897" cy="450" r="23" fill="#D8D0C0" opacity="0.74"/><circle cx="969" cy="450" r="23" fill="#D8D0C0" opacity="0.74"/><circle cx="1041" cy="450" r="23" fill="#D8D0C0" opacity="0.74"/><circle cx="1113" cy="450" r="23" fill="#D8D0C0" opacity="0.74"/><circle cx="1185" cy="450" r="23" fill="#D8D0C0" opacity="0.74"/><circle cx="1257" cy="450" r="23" fill="#D8D0C0" opacity="0.74"/><circle cx="1329" cy="450" r="23" fill="#D8D0C0" opacity="0.74"/><circle cx="1401" cy="450" r="23" fill="#D8D0C0" opacity="0.74"/><circle cx="825" cy="530" r="23" fill="#D8D0C0" opacity="0.74"/><circle cx="897" cy="530" r="23" fill="#16803C" opacity="1"/><text class="mono" x="897" y="536" fill="#fff" font-size="12" font-weight="900" text-anchor="middle">OK</text><circle cx="969" cy="530" r="23" fill="#D8D0C0" opacity="0.74"/><circle cx="1041" cy="530" r="23" fill="#D8D0C0" opacity="0.74"/><circle cx="1113" cy="530" r="23" fill="#D8D0C0" opacity="0.74"/><circle cx="1185" cy="530" r="23" fill="#D8D0C0" opacity="0.74"/><circle cx="1257" cy="530" r="23" fill="#D8D0C0" opacity="0.74"/><circle cx="1329" cy="530" r="23" fill="#D8D0C0" opacity="0.74"/><circle cx="1401" cy="530" r="23" fill="#D8D0C0" opacity="0.74"/><circle cx="825" cy="610" r="23" fill="#D8D0C0" opacity="0.74"/><circle cx="897" cy="610" r="23" fill="#D8D0C0" opacity="0.74"/><circle cx="969" cy="610" r="23" fill="#D8D0C0" opacity="0.74"/><circle cx="1041" cy="610" r="23" fill="#D8D0C0" opacity="0.74"/><circle cx="1113" cy="610" r="23" fill="#D8D0C0" opacity="0.74"/><circle cx="1185" cy="610" r="23" fill="#D8D0C0" opacity="0.74"/><circle cx="1257" cy="610" r="23" fill="#D8D0C0" opacity="0.74"/><circle cx="1329" cy="610" r="23" fill="#B42318" opacity="1"/><text class="mono" x="1329" y="616" fill="#fff" font-size="10" font-weight="900" text-anchor="middle">MAX</text><circle cx="1401" cy="610" r="23" fill="#D8D0C0" opacity="0.74"/><text class="mono" x="1130" y="710" fill="#B42318" font-size="18" font-weight="850" text-anchor="middle">green exists  !=  red wins</text><rect x="410" y="785" width="780" height="96" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="430" y="813" fill="#B42318" font-size="15" font-weight="900" text-anchor="start">CAVEAT</text><text class="ui" x="430" y="842" fill="#171717" font-size="20" font-weight="640" text-anchor="start">The roughly 400-candidate peak shown in the lecture is</text><text class="ui" x="430" y="869" fill="#171717" font-size="20" font-weight="640" text-anchor="start">setup-specific, not a universal optimum.</text></svg>
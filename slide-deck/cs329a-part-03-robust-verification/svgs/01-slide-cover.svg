<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" stroke-width="1" opacity="0.38"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs><style>.ui{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Arial,sans-serif;letter-spacing:0}.mono{font-family:"SFMono-Regular","SF Mono",Consolas,monospace;letter-spacing:0}</style><rect width="1600" height="900" fill="#F5F0E6"/><rect width="1600" height="900" fill="url(#grid)"/><rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.9"/><rect x="84" y="68" width="259" height="43" rx="8" fill="#F2FBF8" stroke="#2F7373" stroke-width="2"/><text class="mono" x="108" y="97" fill="#2F7373" font-size="16" font-weight="900" text-anchor="start">ROBUST VERIFICATION</text><rect x="1146" y="68" width="370" height="43" rx="8" fill="#FFFCF4" stroke="#D8D0C0" stroke-width="2"/><text class="mono" x="1331" y="97" fill="#5E6670" font-size="15" font-weight="780" text-anchor="middle">PART 3  00:09-00:52 / 14:19-18:24</text><text class="ui" x="90" y="240" fill="#171717" font-size="66" font-weight="930" text-anchor="start">A Generator Is Only</text><text class="ui" x="90" y="316" fill="#171717" font-size="66" font-weight="930" text-anchor="start">as Useful as Its Selector</text><text class="ui" x="94" y="450" fill="#5E6670" font-size="26" font-weight="560" text-anchor="start">Candidate coverage may rise while</text><text class="ui" x="94" y="484" fill="#5E6670" font-size="26" font-weight="560" text-anchor="start">selected-answer accuracy stays flat or</text><text class="ui" x="94" y="518" fill="#5E6670" font-size="26" font-weight="560" text-anchor="start">falls.</text><rect x="95" y="660" width="220" height="56" rx="8"
ui" x="800" y="540" fill="#171717" font-size="23" font-weight="720" text-anchor="middle">step quality proxy</text><path d="M600 515 L360 515" fill="none" stroke="#2F7373" stroke-width="5"  marker-end="url(#arrow)"/><rect x="90" y="425" width="270" height="180" rx="8" fill="#F3F7FF" stroke="#2563EB" stroke-width="2"/><text class="mono" x="225" y="478" fill="#2563EB" font-size="20" font-weight="900" text-anchor="middle">INFERENCE</text><text class="ui" x="225" y="530" fill="#171717" font-size="21" font-weight="700" text-anchor="middle">rerank candidates</text><path d="M1000 515 L1240 515" fill="none" stroke="#722F37" stroke-width="5"  marker-end="url(#arrow)"/><rect x="1240" y="425" width="270" height="180" rx="8" fill="#FFF5F3" stroke="#722F37" stroke-width="2"/><text class="mono" x="1375" y="478" fill="#722F37" font-size="20" font-weight="900" text-anchor="middle">TRAINING</text><text class="ui" x="1375" y="530" fill="#171717" font-size="21" font-weight="700" text-anchor="middle">PPO reward</text><path d="M1375 605 L1375 700" fill="none" stroke="#722F37" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1375 700 L1010 700" fill="none" stroke="#722F37" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1010 700 L1010 600" fill="none" stroke="#722F37" stroke-width="3"  marker-end="url(#arrow)"/><rect x="430" y="745" width="740" height="96" rx="8" fill="#FFF5F3" stroke="#B42318" stroke-width="2"/><text class="mono" x="450" y="773" fill="#B42318" font-size="15" font-weight="900" text-anchor="start">CAVEAT</text><text class="ui" x="450" y="802" fill="#171717" font-size="20" font-weight="640" text-anchor="start">Optimizing an imperfect reward model can raise the proxy</text><text class="ui" x="450" y="829" fill="#171717" font-size="20" font-weight="640" text-anchor="start">score without improving correctness.</text></svg>
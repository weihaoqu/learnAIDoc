  </g><text class="ui" x="110" y="270" fill="#171717" font-size="76" font-weight="900" text-anchor="start">From Advice</text><text class="ui" x="110" y="358" fill="#171717" font-size="76" font-weight="900" text-anchor="start">to Task Loop</text><text class="ui" x="116" y="488" fill="#5E6670" font-size="31" font-weight="540" text-anchor="start">The upgrade is AI participating in perception,</text><text class="ui" x="116" y="527" fill="#5E6670" font-size="31" font-weight="540" text-anchor="start">action, and feedback.</text><g transform="translate(220 575)">

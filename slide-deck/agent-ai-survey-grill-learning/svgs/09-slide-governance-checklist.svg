      <text class="ui" x="742" y="515" fill="#171717" font-size="24" font-weight="680" text-anchor="start">Human authority for grading, discipline,</text><text class="ui" x="742" y="546" fill="#171717" font-size="24" font-weight="680" text-anchor="start">accommodations, appeals</text>
    </g><g>
      <rect x="650" y="571" width="780" height="86" rx="8" fill="#FFFCF4" stroke="#B42318" stroke-width="2"/>

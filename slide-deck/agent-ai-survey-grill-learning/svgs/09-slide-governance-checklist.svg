      <path d="M690 278 l9 10 l20 -24" fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
      <text class="ui" x="742" y="291" fill="#171717" font-size="24" font-weight="680" text-anchor="start">Consent before recording or analyzing people</text>
    </g><g>
      <rect x="650" y="347" width="780" height="86" rx="8" fill="#FFFCF4" stroke="#2F7373" stroke-width="2"/>

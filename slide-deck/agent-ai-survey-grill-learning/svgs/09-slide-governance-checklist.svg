      <text class="ui" x="742" y="627" fill="#171717" font-size="24" font-weight="680" text-anchor="start">No unauthorized upload of course or peer</text><text class="ui" x="742" y="658" fill="#171717" font-size="24" font-weight="680" text-anchor="start">material</text>

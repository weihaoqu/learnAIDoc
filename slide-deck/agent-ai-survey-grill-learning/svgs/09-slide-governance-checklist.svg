    <text class="ui" x="86" y="212" fill="#171717" font-size="58" font-weight="880" text-anchor="start">Classroom Agents Need</text><text class="ui" x="86" y="280" fill="#171717" font-size="58" font-weight="880" text-anchor="start">Boundaries Before Deployment</text>
    <text class="ui" x="90" y="372" fill="#5E6670" font-size="27" font-weight="520" text-anchor="start">Consent, audit, authority, and material protection must be</text><text class="ui" x="90" y="406" fill="#5E6670" font-size="27" font-weight="520" text-anchor="start">explicit.</text><g>
      <rect x="650" y="235" width="780" height="86" rx="8" fill="#FFFCF4" stroke="#2563EB" stroke-width="2"/>

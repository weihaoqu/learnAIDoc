<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" stroke-width="1" opacity="0.42"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2F7373"/>
    </marker>
  </defs>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Arial, sans-serif; letter-spacing: 0; }
    .mono { font-family: "SFMono-Regular", "SF Mono", Consolas, "Liberation Mono", Menlo, monospace; letter-spacing: 0; }
  </style>
  <rect width="1600" height="900" fill="#F5F0E6"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.82"/>
  <path d="M42 150 H1558" stroke="#D8D0C0" stroke-width="2"/>
  <g>
    <rect x="88" y="74" width="236" height="44" rx="8" fill="#2F7373" opacity="0.13" stroke="#2F7373" stroke-width="1.5"/>
    <text class="mono" x="110" y="103" fill="#2F7373" font-size="19" font-weight="850">GRILL CORRECTION</text>
  </g>
    <text class="ui" x="86" y="212" fill="#171717" font-size="58" font-weight="880" text-anchor="start">Multimodal Is Not</text><text class="ui" x="86" y="280" fill="#171717" font-size="58" font-weight="880" text-anchor="start">Automatically Agentic</text>
    <text class="ui" x="90" y="372" fill="#5E6670" font-size="27" font-weight="520" text-anchor="start">The difference is the task loop, not just the media type.</text><circle cx="104" cy="552" r="6" fill="#2F7373"/><text class="ui" x="129" y="560" fill="#171717" font-size="25" font-weight="610" text-anchor="start">Multimodal: understands text,</text><text class="ui" x="129" y="592" fill="#171717" font-size="25" font-weight="610" text-anchor="start">image, video, audio, signals</text><circle cx="104" cy="634" r="6" fill="#2F7373"/><text class="ui" x="129" y="642" fill="#171717" font-size="25" font-weight="610" text-anchor="start">Agentic: chooses actions from</text><text class="ui" x="129" y="674" fill="#171717" font-size="25" font-weight="610" text-anchor="start">perception, state, goal, feedback</text><circle cx="104" cy="716" r="6" fill="#2F7373"/><text class="ui" x="129" y="724" fill="#171717" font-size="25" font-weight="610" text-anchor="start">A caption is not yet an agent</text><g transform="translate(650 250)">
    <rect x="0" y="0" width="360" height="380" rx="8" fill="#F7FAFF" stroke="#2563EB" stroke-width="2"/>
    <text class="ui" x="180" y="65" fill="#2563EB" font-size="33" font-weight="900" text-anchor="middle">Multimodal</text>
    <text class="ui" x="44" y="130" fill="#171717" font-size="25" font-weight="600" text-anchor="start">Understands different</text><text class="ui" x="44" y="164" fill="#171717" font-size="25" font-weight="600" text-anchor="start">sources of information:</text><text class="ui" x="44" y="198" fill="#171717" font-size="25" font-weight="600" text-anchor="start">text, image, video, audio,</text><text class="ui" x="44" y="232" fill="#171717" font-size="25" font-weight="600" text-anchor="start">screen state.</text>
  </g><g transform="translate(1070 250)">
    <rect x="0" y="0" width="360" height="380" rx="8" fill="#F5FFFC" stroke="#2F7373" stroke-width="2"/>
    <text class="ui" x="180" y="65" fill="#2F7373" font-size="33" font-weight="900" text-anchor="middle">Agentic</text>
    <text class="ui" x="44" y="130" fill="#171717" font-size="25" font-weight="600" text-anchor="start">Uses perception plus state,</text><text class="ui" x="44" y="164" fill="#171717" font-size="25" font-weight="600" text-anchor="start">goal, action, and feedback</text><text class="ui" x="44" y="198" fill="#171717" font-size="25" font-weight="600" text-anchor="start">to decide what happens</text><text class="ui" x="44" y="232" fill="#171717" font-size="25" font-weight="600" text-anchor="start">next.</text>
  </g><rect x="835" y="690" width="410" height="58" rx="8" fill="#B7791F" opacity="0.13" stroke="#B7791F" stroke-width="2"/>
  <text class="ui" x="1040" y="728" fill="#B7791F" font-size="25" font-weight="850" text-anchor="middle">More media is not the same as agency</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" stroke-width="1" opacity="0.42"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2F7373"/>
    </marker>
  </defs>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Arial, sans-serif; letter-spacing: 0; }
    .mono { font-family: "SFMono-Regular", "SF Mono", Consolas, "Liberation Mono", Menlo, monospace; letter-spacing: 0; }
  </style>
  <rect width="1600" height="900" fill="#F5F0E6"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.82"/>
  <path d="M42 150 H1558" stroke="#D8D0C0" stroke-width="2"/>
  <g>
    <rect x="88" y="74" width="212" height="44" rx="8" fill="#2F7373" opacity="0.13" stroke="#2F7373" stroke-width="1.5"/>
    <text class="mono" x="110" y="103" fill="#2F7373" font-size="19" font-weight="850">CLASSROOM TEST</text>
  </g>
    <text class="ui" x="86" y="212" fill="#171717" font-size="58" font-weight="880" text-anchor="start">The Classroom</text><text class="ui" x="86" y="280" fill="#171717" font-size="58" font-weight="880" text-anchor="start">Video Test</text>
    <text class="ui" x="90" y="372" fill="#5E6670" font-size="27" font-weight="520" text-anchor="start">Saying &quot;three students look confused&quot; is perception, not the</text><text class="ui" x="90" y="406" fill="#5E6670" font-size="27" font-weight="520" text-anchor="start">full agent loop.</text><circle cx="104" cy="552" r="6" fill="#2F7373"/><text class="ui" x="129" y="560" fill="#171717" font-size="25" font-weight="610" text-anchor="start">Describe confusion: multimodal</text><text class="ui" x="129" y="592" fill="#171717" font-size="25" font-weight="610" text-anchor="start">perception</text><circle cx="104" cy="634" r="6" fill="#2F7373"/><text class="ui" x="129" y="642" fill="#171717" font-size="25" font-weight="610" text-anchor="start">Reteach + quiz + observe: agentic</text><text class="ui" x="129" y="674" fill="#171717" font-size="25" font-weight="610" text-anchor="start">loop</text><circle cx="104" cy="716" r="6" fill="#2F7373"/><text class="ui" x="129" y="724" fill="#171717" font-size="25" font-weight="610" text-anchor="start">Description alone is not enough</text><g transform="translate(690 255)">
    <rect x="0" y="0" width="300" height="155" rx="8" fill="#F7FAFF" stroke="#2563EB" stroke-width="2"/>
    <text class="ui" x="150" y="62" fill="#2563EB" font-size="29" font-weight="900" text-anchor="middle">Video input</text>
    <text class="ui" x="150" y="108" fill="#171717" font-size="23" font-weight="650" text-anchor="middle">students look confused</text>
  </g><path d="M995 315 C1035 315, 1035 280, 1075 280" fill="none" stroke="#8B7355" stroke-width="4" marker-end="url(#arrow)"/><path d="M995 335 C1035 335, 1035 520, 1075 520" fill="none" stroke="#2F7373" stroke-width="4" marker-end="url(#arrow)"/><g transform="translate(1090 210)">
    <rect x="0" y="0" width="340" height="142" rx="8" fill="#FFFCF4" stroke="#8B7355" stroke-width="2"/>
    <text class="ui" x="170" y="58" fill="#8B7355" font-size="27" font-weight="900" text-anchor="middle">Describe only</text>
    <text class="ui" x="170" y="104" fill="#171717" font-size="22" font-weight="650" text-anchor="middle">multimodal model</text>
  </g><g transform="translate(1090 435)">
    <rect x="0" y="0" width="340" height="210" rx="8" fill="#F5FFFC" stroke="#2F7373" stroke-width="2"/>
    <text class="ui" x="170" y="52" fill="#2F7373" font-size="27" font-weight="900" text-anchor="middle">Act + adapt</text>
    <text class="ui" x="54" y="100" fill="#171717" font-size="24" font-weight="690" text-anchor="start">reteach</text><text class="ui" x="54" y="134" fill="#171717" font-size="24" font-weight="690" text-anchor="start">quiz</text><text class="ui" x="54" y="168" fill="#171717" font-size="24" font-weight="690" text-anchor="start">observe</text><text class="ui" x="54" y="202" fill="#171717" font-size="24" font-weight="690" text-anchor="start">adjust</text>
    <text class="ui" x="170" y="190" fill="#2F7373" font-size="22" font-weight="850" text-anchor="middle">agentic loop</text>
  </g>
</svg>
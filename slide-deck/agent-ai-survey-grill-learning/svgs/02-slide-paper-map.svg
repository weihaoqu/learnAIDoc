<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" stroke-width="1" opacity="0.42"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2F7373"/>
    </marker>
  </defs>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Arial, sans-serif; letter-spacing: 0; }
    .mono { font-family: "SFMono-Regular", "SF Mono", Consolas, "Liberation Mono", Menlo, monospace; letter-spacing: 0; }
  </style>
  <rect width="1600" height="900" fill="#F5F0E6"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.82"/>
  <path d="M42 150 H1558" stroke="#D8D0C0" stroke-width="2"/>
  <g>
    <rect x="88" y="74" width="170" height="44" rx="8" fill="#2F7373" opacity="0.13" stroke="#2F7373" stroke-width="1.5"/>
    <text class="mono" x="110" y="103" fill="#2F7373" font-size="19" font-weight="850">PAPER MAP</text>
  </g>
    <text class="ui" x="86" y="212" fill="#171717" font-size="58" font-weight="880" text-anchor="start">The Paper Gives a Map,</text><text class="ui" x="86" y="280" fill="#171717" font-size="58" font-weight="880" text-anchor="start">Not a Finished Machine</text>
    <text class="ui" x="90" y="372" fill="#5E6670" font-size="27" font-weight="520" text-anchor="start">Use it as a conceptual vocabulary, not a 2026 state-of-the-art</text><text class="ui" x="90" y="406" fill="#5E6670" font-size="27" font-weight="520" text-anchor="start">catalog.</text><circle cx="104" cy="527" r="6" fill="#2F7373"/><text class="ui" x="129" y="535" fill="#171717" font-size="25" font-weight="610" text-anchor="start">January 2024 survey</text><circle cx="104" cy="577" r="6" fill="#2F7373"/><text class="ui" x="129" y="585" fill="#171717" font-size="25" font-weight="610" text-anchor="start">Moves beyond &quot;LLM + tools + memory&quot;</text><circle cx="104" cy="627" r="6" fill="#2F7373"/><text class="ui" x="129" y="635" fill="#171717" font-size="25" font-weight="610" text-anchor="start">Centers multimodal perception,</text><text class="ui" x="129" y="667" fill="#171717" font-size="25" font-weight="610" text-anchor="start">grounded environments, action, and</text><text class="ui" x="129" y="699" fill="#171717" font-size="25" font-weight="610" text-anchor="start">feedback</text><g transform="translate(780 250)">
    <rect x="0" y="0" width="650" height="410" rx="8" fill="#FFFCF4" stroke="#8B7355" stroke-width="2"/>
    <text class="mono" x="44" y="68" fill="#722F37" font-size="26" font-weight="850">READING HEURISTIC</text>
    <text class="ui" x="62" y="126" fill="#171717" font-size="30" font-weight="760" text-anchor="start">foundation model</text><text class="ui" x="62" y="170" fill="#2F7373" font-size="30" font-weight="760" text-anchor="start">+ multimodal perception</text><text class="ui" x="62" y="214" fill="#2F7373" font-size="30" font-weight="760" text-anchor="start">+ grounded environment</text><text class="ui" x="62" y="258" fill="#2F7373" font-size="30" font-weight="760" text-anchor="start">+ action prediction</text><text class="ui" x="62" y="302" fill="#2F7373" font-size="30" font-weight="760" text-anchor="start">+ feedback loop</text><text class="ui" x="62" y="346" fill="#2F7373" font-size="30" font-weight="760" text-anchor="start">+ evaluation in context</text>
  </g>
</svg>
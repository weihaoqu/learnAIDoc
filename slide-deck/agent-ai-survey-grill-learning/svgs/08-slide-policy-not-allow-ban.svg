<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0 L0 0 0 46" fill="none" stroke="#D8D0C0" stroke-width="1" opacity="0.42"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2F7373"/>
    </marker>
  </defs>
  <style>
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Arial, sans-serif; letter-spacing: 0; }
    .mono { font-family: "SFMono-Regular", "SF Mono", Consolas, "Liberation Mono", Menlo, monospace; letter-spacing: 0; }
  </style>
  <rect width="1600" height="900" fill="#F5F0E6"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="42" y="42" width="1516" height="816" rx="8" fill="#FFFCF4" opacity="0.82"/>
  <path d="M42 150 H1558" stroke="#D8D0C0" stroke-width="2"/>
  <g>
    <rect x="88" y="74" width="170" height="44" rx="8" fill="#2F7373" opacity="0.13" stroke="#2F7373" stroke-width="1.5"/>
    <text class="mono" x="110" y="103" fill="#2F7373" font-size="19" font-weight="850">POLICY</text>
  </g>
    <text class="ui" x="86" y="212" fill="#171717" font-size="58" font-weight="880" text-anchor="start">&quot;AI Allowed&quot; and &quot;AI Banned&quot;</text><text class="ui" x="86" y="280" fill="#171717" font-size="58" font-weight="880" text-anchor="start">Are Both Too Weak</text>
    <text class="ui" x="90" y="372" fill="#5E6670" font-size="27" font-weight="520" text-anchor="start">Agentic systems need operational boundaries, not slogans.</text><circle cx="104" cy="552" r="6" fill="#2F7373"/><text class="ui" x="129" y="560" fill="#171717" font-size="25" font-weight="610" text-anchor="start">Approved tools</text><circle cx="104" cy="602" r="6" fill="#2F7373"/><text class="ui" x="129" y="610" fill="#171717" font-size="25" font-weight="610" text-anchor="start">Allowed and forbidden uses</text><circle cx="104" cy="652" r="6" fill="#2F7373"/><text class="ui" x="129" y="660" fill="#171717" font-size="25" font-weight="610" text-anchor="start">Privacy-safe disclosure</text><circle cx="104" cy="702" r="6" fill="#2F7373"/><text class="ui" x="129" y="710" fill="#171717" font-size="25" font-weight="610" text-anchor="start">Explicit exam and authorship</text><text class="ui" x="129" y="742" fill="#171717" font-size="25" font-weight="610" text-anchor="start">boundaries</text><g transform="translate(650 260)">
    <rect x="0" y="0" width="300" height="290" rx="8" fill="#FFF7F7" stroke="#B42318" stroke-width="2"/>
    <text class="ui" x="150" y="90" fill="#B42318" font-size="36" font-weight="900" text-anchor="middle">ALLOW</text>
    <line x1="70" y1="145" x2="230" y2="145" stroke="#D8D0C0" stroke-width="4"/>
    <text class="ui" x="150" y="210" fill="#B42318" font-size="36" font-weight="900" text-anchor="middle">BAN</text>
  </g><path d="M958 405 C986.5 405, 986.5 405, 1015 405" fill="none" stroke="#2F7373" stroke-width="4" marker-end="url(#arrow)"/><g transform="translate(1030 230)">
    <rect x="0" y="0" width="400" height="375" rx="8" fill="#F5FFFC" stroke="#2F7373" stroke-width="2"/>
    <text class="ui" x="200" y="55" fill="#2F7373" font-size="30" font-weight="900" text-anchor="middle">Policy matrix</text>
    <g><rect x="42" y="92" width="26" height="26" rx="5" fill="#2F7373" opacity="0.15" stroke="#2F7373" stroke-width="2"/><text class="ui" x="82" y="114" fill="#171717" font-size="24" font-weight="700">Approved tools</text></g><g><rect x="42" y="142" width="26" height="26" rx="5" fill="#2F7373" opacity="0.15" stroke="#2F7373" stroke-width="2"/><text class="ui" x="82" y="164" fill="#171717" font-size="24" font-weight="700">Allowed uses</text></g><g><rect x="42" y="192" width="26" height="26" rx="5" fill="#2F7373" opacity="0.15" stroke="#2F7373" stroke-width="2"/><text class="ui" x="82" y="214" fill="#171717" font-size="24" font-weight="700">Forbidden uses</text></g><g><rect x="42" y="242" width="26" height="26" rx="5" fill="#2F7373" opacity="0.15" stroke="#2F7373" stroke-width="2"/><text class="ui" x="82" y="264" fill="#171717" font-size="24" font-weight="700">Disclosure</text></g><g><rect x="42" y="292" width="26" height="26" rx="5" fill="#2F7373" opacity="0.15" stroke="#2F7373" stroke-width="2"/><text class="ui" x="82" y="314" fill="#171717" font-size="24" font-weight="700">Exam boundary</text></g>
  </g>
</svg>
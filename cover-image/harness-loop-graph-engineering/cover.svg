<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f4ee"/>
      <stop offset="1" stop-color="#e9f0f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1b2430" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d2939"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="80" y="70" width="1440" height="760" rx="34" fill="#fffdf8" stroke="#d8dfdf" stroke-width="3"/>

  <text x="132" y="167" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="800">Harness / Loop / Graph Engineering</text>
  <text x="135" y="222" fill="#53606b" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="500">Environment, feedback, and flow for reliable AI agents</text>

  <g filter="url(#shadow)">
    <rect x="132" y="330" width="360" height="300" rx="24" fill="#e6f7f4" stroke="#1d9a8a" stroke-width="4"/>
    <rect x="620" y="330" width="360" height="300" rx="24" fill="#fff1d9" stroke="#d8911b" stroke-width="4"/>
    <rect x="1108" y="330" width="360" height="300" rx="24" fill="#f0e8ff" stroke="#7654d8" stroke-width="4"/>
  </g>

  <path d="M505 480 C555 480 565 480 605 480" fill="none" stroke="#1d2939" stroke-width="8" marker-end="url(#arrow)"/>
  <path d="M993 480 C1043 480 1053 480 1093 480" fill="none" stroke="#1d2939" stroke-width="8" marker-end="url(#arrow)"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="312" y="407" text-anchor="middle" fill="#0c6d63" font-size="38" font-weight="800">HARNESS</text>
    <text x="312" y="462" text-anchor="middle" fill="#102a2b" font-size="58" font-weight="900">Environment</text>
    <text x="312" y="520" text-anchor="middle" fill="#42545b" font-size="27">tools / files / permissions</text>
    <text x="312" y="562" text-anchor="middle" fill="#42545b" font-size="27">state / traces / approvals</text>

    <text x="800" y="407" text-anchor="middle" fill="#9a630b" font-size="38" font-weight="800">LOOP</text>
    <text x="800" y="462" text-anchor="middle" fill="#312413" font-size="58" font-weight="900">Feedback</text>
    <text x="800" y="520" text-anchor="middle" fill="#5b5142" font-size="27">attempt / check / retry</text>
    <text x="800" y="562" text-anchor="middle" fill="#5b5142" font-size="27">tests / graders / reviews</text>

    <text x="1288" y="407" text-anchor="middle" fill="#5b3fc0" font-size="38" font-weight="800">GRAPH</text>
    <text x="1288" y="462" text-anchor="middle" fill="#271a52" font-size="58" font-weight="900">Flow</text>
    <text x="1288" y="520" text-anchor="middle" fill="#504760" font-size="27">branches / joins / routing</text>
    <text x="1288" y="562" text-anchor="middle" fill="#504760" font-size="27">approvals / recovery paths</text>
  </g>

  <g transform="translate(132 698)">
    <rect x="0" y="0" width="1336" height="72" rx="18" fill="#111827"/>
    <text x="668" y="47" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Fix the owning layer before adding another agent</text>
  </g>
</svg>

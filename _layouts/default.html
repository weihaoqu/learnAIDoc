<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=JetBrains+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,700..900;1,9..144,700..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="site-container">
      <div class="header-inner">
        <a href="{{ '/' | relative_url }}" class="site-title">
          <span class="site-logo">📚</span>
          {{ site.title }}
        </a>
        <div class="header-right">
          <span class="header-stat">{{ site.wiki | size }} entries</span>
        </div>
      </div>
    </div>
  </header>

  <div class="site-container">
    <main>
      {{ content }}
    </main>
  </div>

  <footer class="site-footer">
    <div class="site-container">
      <span>Built with Jekyll & Claude Code</span>
    </div>
  </footer>
</body>
</html>

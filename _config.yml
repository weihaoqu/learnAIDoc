# Site settings
title: My Learning Wiki
description: A personal wiki documenting tricks, skills, and knowledge I've learned
baseurl: "/learnAIDoc"
url: "https://weihaoqu.github.io"

# Build settings
markdown: kramdown
highlighter: rouge

# Collections for wiki-style organization
collections:
  wiki:
    output: true
    permalink: /wiki/:categories/:title/

# Default front matter
defaults:
  - scope:
      path: ""
      type: "wiki"
    values:
      layout: "entry"

# Categories for organizing entries
wiki_categories:
  - name: AI Education
    icon: "🎓"
  - name: Claude Code
    icon: "🖥️"
  - name: Skills & Plugins
    icon: "🔌"
  - name: AI Research
    icon: "🔬"
  - name: Tools
    icon: "🛠️"
  - name: Programming
    icon: "💻"

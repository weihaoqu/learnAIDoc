# Site settings
title: My Learning Wiki
description: A personal wiki documenting tricks, skills, and knowledge I've learned
baseurl: "/learnAIDoc"
url: "https://weihaoqu.github.io"

# Build settings
markdown: kramdown
highlighter: rouge

# Plugins
plugins:
  - jekyll-redirect-from

# Collections for wiki-style organization
collections:
  wiki:
    output: true
    permalink: /wiki/:title/

# Default front matter
defaults:
  - scope:
      path: ""
      type: "wiki"
    values:
      layout: "entry"

# Categories for organizing entries
wiki_categories:
  - name: Claude Code Basics
    icon: "🖥️"
  - name: Claude Code Engineering
    icon: "⚙️"
  - name: Claude Code Workflows
    icon: "🔄"
  - name: Agent Setup & Migration
    icon: "🧳"
  - name: Skills & Plugins
    icon: "🔌"
  - name: AI for Research
    icon: "🔬"
  - name: AI for Teaching
    icon: "🎓"
  - name: Learning Resources
    icon: "📚"
  - name: Prompting & Writing
    icon: "✍️"
  - name: Creative & Media
    icon: "🎨"
  - name: Industry & Trends
    icon: "📊"
